.read-only #tab-state{display:block}
.journey-track{margin:12px 0;border:1px solid var(--line);padding:16px;background:var(--surface)}
.journey-endpoints,.journey-dots{display:flex;align-items:center;justify-content:space-between;gap:8px}
.journey-endpoints b{flex:1;line-height:1.45;font-size:.95rem}.journey-endpoints b:last-child{text-align:right}
.journey-dots{position:relative;gap:clamp(4px,1.2vw,12px)}
.journey-dots::before{content:"";position:absolute;left:0;right:0;border-top:1px solid var(--line)}
.journey-dot{position:relative;display:grid;place-items:center;width:1.55rem;height:1.55rem;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--muted);font:700 .8rem var(--mono)}
.journey-dot.current{background:var(--accent);color:var(--canvas);border-color:var(--accent)}.journey-dot.passed{border-color:var(--success);color:var(--success)}
.journey-track p{margin:12px 0 0;text-align:center;color:var(--muted);font-size:.9rem}
.road-supply svg{width:2rem;height:2rem;color:var(--accent)}.combat .evade-result{color:var(--danger);font-weight:700}

.stash-layout{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px;align-items:start}
.stash-layout .loot-panel{container-type:inline-size}
.stash-grid{--cell:min(58px,calc((100cqw - 2px)/6));margin-inline:auto}
.stash-grid .loot-tile span{font-size:11px;line-height:1.2}
.stash-grid .loot-tile .item-symbol{max-width:42px;max-height:43px}
.stash-sidebar{display:grid;gap:12px;min-width:0}
.stash-sidebar p{font-size:14px;line-height:1.6;color:var(--muted);margin:9px 0}
.stash-sidebar h2 small{font:13px var(--mono);color:var(--muted)}
.stash-sidebar .db-detail-title p{margin:4px 0}
.stash-tools{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}
.stash-tools button{font-size:14px;min-height:42px;padding:7px 10px}
.stash-overflow{max-height:300px;overflow:auto}
.stash-message:not(:empty){color:var(--accent);margin-top:10px;font-size:14px;line-height:1.5}
.stash-summary b{color:var(--text)}
@media(max-width:730px){
  .stash-layout{grid-template-columns:minmax(0,1fr)}
  .stash-grid{--cell:min(54px,calc((100cqw - 2px)/6))}
  .stash-layout .loot-panel,.stash-sidebar .panel{padding:12px}
}

.facility-account{display:grid;grid-template-columns:minmax(0,1.4fr) 1fr 1fr;margin:14px 0 10px;border:1px solid #536249;border-radius:4px;background:#172119}
.facility-account>div{padding:12px clamp(7px,2vw,15px);display:grid;gap:5px;min-width:0}
.facility-account>div+div{border-left:1px solid #41523e}
.facility-account small,.facility-recipe small{color:#b6c2a8}
.facility-account b,.facility-clock{font-variant-numeric:tabular-nums;color:#d3dda7}
.facility-links{justify-content:flex-start;flex-wrap:wrap;gap:6px}
.facility-feedback:not(:empty),.facility-current,.facility-effect{border-left:3px solid #b3c38d;background:#263022;padding:10px 12px;color:#e0e8c9;line-height:1.5}
.facility-feedback:empty{display:none}
.facility-effect b{display:block;color:#c6d79a}
.facility-layout{align-items:start}
.facility-layout .panel{min-width:0}
.facility-bill{display:flex;flex-wrap:wrap;gap:6px 18px;padding:10px 0;font-size:.94em}
.facility-bill b{margin-left:4px}
.facility-materials .facility-deficit{color:#ebbb88}
.facility-materials .facility-ready{color:#c1d79c}
.facility-build{margin:12px 0 4px;width:100%;min-height:44px}
.facility-build:disabled,.facility-recipe button:disabled{opacity:.68}
.facility-job-list{padding:0 0 10px}
.facility-job-list button,.facility-recipe{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.facility-job-list button{width:100%;justify-content:space-between;margin:4px 0;text-align:left}
.facility-operations{margin-top:20px;border-top:1px solid #51614b}
.facility-recipe{justify-content:space-between;border-top:1px solid #40503c;padding:10px 0}
.facility-recipe small{display:block;line-height:1.55;font-size:.86em}
.facility-recipe button{min-height:42px;flex-shrink:0}
.facility-clock{white-space:nowrap}
@media(max-width:700px){
 .facility-layout{display:flex;flex-direction:column}
 .facility-layout>.panel{width:100%;box-sizing:border-box}
 .facility-directory .facilities{max-height:12rem;overflow:auto;overscroll-behavior:contain}
 .facility-account>div{font-size:.93em}.facility-account small{font-size:.87em}
}

.kit-toolbar,.kit-heading,.kit-deploy,.kit-actions{display:flex;align-items:center;gap:.55rem;flex-wrap:wrap}
.kit-toolbar,.kit-deploy{margin:.7rem 0 1rem}
.kit-heading{justify-content:space-between;margin-bottom:.8rem}
.kit-heading h2,.kit-report h2{margin:0}
.kit-heading>span,.kit-slot-head,.kit-rows small{color:var(--muted,#b2b6a4)}
.kit-layout{display:grid;grid-template-columns:minmax(0,1.14fr) minmax(0,1fr);gap:1rem;align-items:start}
.kit-layout>*,.kit-bag{min-width:0}
.kit-slots{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.5rem}
.kit-slot{display:flex;flex-direction:column;gap:.25rem;align-items:flex-start;padding:.65rem;border:1px solid #41483d;background:#1a201a;min-width:0}
.kit-slot.occupied{border-color:#647650;background:#242c20}
.kit-slot-head{display:flex;align-items:center;gap:.45rem;font-size:.82rem}
.kit-slot-head svg{width:1.4rem;height:1.4rem;flex:none}
.kit-slot b,.kit-rows b{word-break:keep-all;overflow-wrap:anywhere}
.kit-slot small,.kit-slot button,.kit-rows small{font-size:.8rem}
.kit-slot small{color:#c0c8b6;line-height:1.4;min-height:1.4em}
.kit-slot button{margin-top:auto;min-height:34px;padding:.25rem .6rem}
.kit-actions button,.kit-rows button{margin:0}
.kit-rows>div,.kit-report li{display:flex;gap:.5rem;align-items:center;justify-content:space-between;border-bottom:1px solid #3c4638;padding:.55rem 0}
.kit-rows small{display:block}
.kit-rows .kit-actions{justify-content:flex-end}
.kit-store,.kit-ground,.kit-shelf,.kit-report{margin-top:1rem}
.kit-shelf details{margin-top:.75rem;border-top:1px solid #424e3a;padding:.75rem 0}
.kit-shelf summary{cursor:pointer;color:var(--accent,#d0dda0)}
.kit-notice{background:#293120;border-left:3px solid #9bad6e;padding:.6rem .8rem;line-height:1.5;color:#e0eacb}
.kit-report ul{list-style:none;padding:0;margin-bottom:0}
.kit-bag .spatial-grid{margin-bottom:.5rem}
@media(max-width:760px){.kit-layout{grid-template-columns:minmax(0,1fr)}.kit-rows>div{flex-wrap:wrap}.kit-slot{padding:.55rem}.kit-slot button{min-height:40px}}
.kit-layout .spatial-grid{width:min(100%,calc(var(--cols) * 52px + 2px));aspect-ratio:var(--cols) / var(--rows);grid-template-columns:repeat(var(--cols),minmax(0,1fr));grid-template-rows:repeat(var(--rows),minmax(0,1fr))}
.kit-vitals{display:flex;gap:.6rem 1.2rem;flex-wrap:wrap;margin:.6rem 0;color:var(--muted,#b2b6a4)}
.kit-vitals b{margin-left:.2em;color:var(--text,#e7e9dd)}
@media(max-width:760px){.kit-layout.on-raid>.kit-wear{order:2}}

.route-map-panel{padding:7px;align-self:start}
.route-plot{position:relative;aspect-ratio:360/250;width:100%;background-color:#1b251d;background-image:linear-gradient(90deg,#65725c20 1px,transparent 1px),linear-gradient(#65725c20 1px,transparent 1px);background-size:21px 21px;overflow:hidden;border:1px solid var(--line)}
.route-chart{display:block;position:absolute;inset:0;width:100%;height:100%;fill:none}
.route-chart .contour{stroke:#80916c;opacity:.24;stroke-width:1.1}
.route-line path{fill:none;stroke:#c0c7a7;stroke-width:1.8}
.route-pip{stroke:#d7af66;stroke-width:1.8;fill:#1b251d}
.route-line.on-route path{stroke:#eac47c;stroke-width:2.8}
.route-pip.passed{fill:#eac47c}
.route-station{box-sizing:border-box;position:absolute;transform:translate(-50%,-50%);width:31%;min-height:45px;padding:4px 1px;border:1px solid #68745c;border-radius:4px;background:#253224;color:#ecebd8;text-align:center;display:grid;justify-items:center;align-content:center;gap:2px;line-height:1.25}
button.route-station:hover{background:#354331}
.route-station[aria-pressed=true],.route-station[aria-current=location]{border-color:#d7af66;box-shadow:0 0 0 2px #d7af6633;background:#343929}
.route-station b{font-size:clamp(12px,2.8vw,16px);white-space:nowrap}
.route-station small,.route-key,.landmark-header>div>small,.landmark-description,.landmark-box-title small,.sector-notes>small{color:var(--muted)}
.route-station small{font-size:clamp(10px,2.5vw,13px)}
.route-key{display:flex;align-items:center;justify-content:center;gap:6px;margin:8px 1px 1px;font-size:13px}
.route-key i{display:inline-block;width:9px;height:9px;border:2px solid var(--accent);border-radius:50%}
.sector-notes h2{margin:3px 0}.sector-notes h3{font-size:15px;margin-bottom:6px}
.sector-notes ul{list-style:none;margin:0;padding:0}
.sector-notes li{display:flex;align-items:center;justify-content:space-between;gap:8px;border-top:1px solid var(--line);padding:8px 0}
.sector-notes li span{white-space:nowrap;color:var(--accent);font-size:14px}
.landmark-header{display:flex;gap:10px;align-items:start;justify-content:space-between;flex-wrap:wrap}
.landmark-header h2{margin:3px 0}
.landmark-picker{align-self:center;min-width:min(100%,145px)}
.landmark-picker[open]{flex-basis:100%}
.landmark-picker summary{border:1px solid var(--line);border-radius:4px;cursor:pointer;padding:11px 12px;min-height:44px;background:var(--panel);font-size:14px}
.landmark-picker summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.landmark-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,128px),1fr));gap:6px;margin:8px 0 0}
.landmark-list button,.route-choices button{display:grid;gap:3px;align-content:center;text-align:left;min-height:46px}
.landmark-list button small,.route-choices button small{font-size:12px;color:var(--muted)}
.landmark-list button[aria-pressed=true]{border-color:var(--accent)}
.landmark-description{margin:8px 0 12px;line-height:1.5}
.landmark-box-title{font-size:16px;margin:15px 0 8px}
.landmark-box-title small{font-weight:400;font-size:13px}
.route-choices>div{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.route-choices .mini-field{margin:6px 0 10px}
@media(max-width:350px){.route-key{font-size:12px}.route-station{min-height:40px;width:32%}}

  const pool=EXITS.filter(e=>e.id!=='b04').map(e=>e.id);
  for(let i=pool.length-1;i>0;i--){const k=Math.floor(Math.random()*(i+1));[pool[i],pool[k]]=[pool[k],pool[i]]}
  return ['b04',...pool.slice(0,1+Math.floor(Math.random()*3))];

  if(!Number.isInteger(field.steps))field.steps=0;

  if(!Number.isInteger(field.victories))field.victories=0;

}

function pointStatus(e, time, starting){

  const spec=CONTACTS[raid.zone];
  field.contact={zone:raid.zone,hp:spec.hp};
  field.nextContact=field.steps+3+Math.floor(Math.random()*3);

  const c=field.contact;

  const strike=a.type==='engage';
  if(!strike&&(a.escaped??(Math.random()<ESCAPE_CHANCE))){
    field.contact=null;
    logField(spec.name+'에게서 도주 성공.');
    if(field.journey)resumeJourney(a.end);
    return;
  }
  if(strike){
    const hit=14+Math.min(10,playerLevel()-1)+gearAttackBonus()+Math.floor(Math.random()*7);
    c.hp=Math.max(0,c.hp-hit);
    if(!c.hp){
      field.contact=null;
      field.victories++;
      logField(spec.name+' 무력화.');
      if(field.journey)resumeJourney(a.end);
      return;
    }
    delete c.escapeDamage;
  }
  const damage=Math.max(1,(strike?spec.power:Math.ceil(spec.power*0.55))+Math.floor(Math.random()*5)-gearDefenseBonus());

  field.hp=Math.max(0,field.hp-damage);

const ENDINGS={
  success:['SURVIVED','탈출 성공'], quick:['RUN THROUGH','조기 탈출'], kia:['KIA','전투 불능'], expired:['MIA','시간 초과'],abandoned:['LEFT','레이드 포기']

function reconcileEnd(result,at,exit=null){
  if(!raid || field.result && (field.result!=='expired'||lastSummary?.raidId===raid.startedAt))return;
  const goods=field.bag.map(o=>o.g).filter(id=>Object.hasOwn(GOODS,id));
  const returned=result==='success';
  const elapsed=Math.max(0,Math.min(RAID_DURATION_MS,at-raid.startedAt));
  const searched=Object.values(field.boxes).filter(b=>b.complete).length;
  const visited=(field.visited||[raid.zone]).length;
  const victories=field.victories||0;
  const quick=returned && elapsed<7*60000 && searched<2 && !victories;
  const rating=quick?'quick':result;
  const cost=returned&&exit?.rule==='pay'?15000:0;
  const earned=returned?(quick?25:100+searched*25+Math.max(0,visited-1)*20+victories*50):0;
  let commission=0, missionXp=0, orderName='';
  const order=ORDERS.find(q=>q.id===career.order);
  if(returned&&!quick&&order&&((order.id==='scout'&&visited>=2)||(order.id==='stores'&&searched>=2)||(order.id==='signals'&&victories>=1))){
    commission=order.cr;missionXp=order.xp;orderName=order.title;
    career.done.push(order.id);career.order=null;
  }
  if(returned){
    for(const id of goods)addStashGoods(id);
    wallet+=commission-cost;
    career.returns++;
  }
  const worn=finishEquipmentRaid(returned);
  career.sorties++;career.xp+=earned+missionXp;
  const summary={raidId:raid.startedAt,result,rating,exit:exit?.name||null,elapsed,goods,cost,visited,searched,victories,
    worn,earned,commission,missionXp,orderName};
  lastSummary=summary;
  career.history.unshift({rating,elapsed,xp:earned+missionXp,exit:summary.exit});
  career.history.length=Math.min(12,career.history.length);
  field.result=result;field.journey=null;field.bag=[];field.action=null;field.contact=null;field.open=null;picked=null;dragged=null;exitNotice='';
  logField(ENDINGS[rating][1]+'. 정산 완료.');
}

    '<div class="field-metrics"><div>경과 시간<b>'+formatRaid(r.elapsed)+'</b></div><div>방문 지역<b>'+r.visited+'</b></div><div>수색 완료<b>'+r.searched+'</b></div><div>교전 승리<b>'+(r.victories||0)+'</b></div></div>'+

// Aggregate stock includes every item in the grid and in the incoming-goods queue.
let stashSlots = [];
let stashSelection = null;
let stashDrag = null;
let stashNotice = '';
let stashUidSequence = 0;

function stashSize() {
  return [6, 8 + 2 * hideoutLevel('stash')];
}

function stashCount(id) {
  return Object.hasOwn(GOODS, id) && Number.isSafeInteger(stash[id]) && stash[id] > 0 ? stash[id] : 0;
}

function stashOverflowCount(id) {
  return stashCount(id) - stashSlots.filter(unit => unit.g === id).length;
}

function stashSalePrice(id) {
  return Object.hasOwn(GOODS, id) ? Math.max(1, Math.floor(GOODS[id][6] / 2)) : 0;
}

function newStashUid() {
  const suffix = globalThis.crypto?.randomUUID?.() ?? (Date.now().toString(36) + '-' + (++stashUidSequence).toString(36));
  return 's-' + suffix;
}

function placeIncomingGoods(id, amount) {
  const [, w, h] = GOODS[id];
  const size = stashSize();
  for (let i = 0; i < amount; i++) {
    let width = w, height = h;
    let pos = firstFit(stashSlots, size, width, height);
    if (!pos && w !== h) {
      width = h;
      height = w;
      pos = firstFit(stashSlots, size, width, height);
    }
    if (!pos) break;
    stashSlots.push({ uid: newStashUid(), g: id, ...pos, w: width, h: height });
  }
}

function refreshStashLayout() {
  for (const id of Object.keys(stash)) {
    const count = stashOverflowCount(id);
    if (count > 0) placeIncomingGoods(id, count);
  }
}

function loadStashLayout(savedSlots) {
  stashSlots = [];
  stashSelection = stashDrag = null;
  stashNotice = '';
  if (!Array.isArray(savedSlots)) {
    const ids = Object.keys(stash).filter(id => stashCount(id));
    ids.sort((a, b) => GOODS[b][1] * GOODS[b][2] - GOODS[a][1] * GOODS[a][2]);
    for (const id of ids) placeIncomingGoods(id, stashCount(id));
    return;
  }
  const size = stashSize(), seen = new Set();
  for (const s of savedSlots) {
    if (!s || !stashCount(s.g) || stashOverflowCount(s.g) <= 0) continue;
    const [, w, h] = GOODS[s.g];
    if (!((s.w === w && s.h === h) || (s.w === h && s.h === w))) continue;
    if (!fits(stashSlots, size, s.x, s.y, s.w, s.h)) continue;
    const uid = typeof s.uid === 'string' && /^s-[a-z0-9-]{1,72}$/.test(s.uid) && !seen.has(s.uid) ? s.uid : newStashUid();
    stashSlots.push({ uid, g: s.g, x: s.x, y: s.y, w: s.w, h: s.h });
    seen.add(uid);
  }
}

function addStashGoods(id, amount = 1) {
  if (!Object.hasOwn(GOODS, id) || !Number.isSafeInteger(amount) || amount < 1) return false;
  const next = stashCount(id) + amount;
  if (!Number.isSafeInteger(next)) return false;
  stash[id] = next;
  placeIncomingGoods(id, amount);
  return true;
}

function takeStashGoods(id, amount = 1, uid = null) {
  const count = stashCount(id);
  if (!Number.isSafeInteger(amount) || amount < 1 || amount > count) return false;
  const unplaced = stashOverflowCount(id);
  if (uid === 'overflow') {
    if (amount > unplaced) return false;
  } else if (uid !== null) {
    const index = stashSlots.findIndex(unit => unit.uid === uid && unit.g === id);
    if (amount !== 1 || index < 0) return false;
    stashSlots.splice(index, 1);
  } else {
    let remove = Math.max(0, amount - unplaced);
    for (let i = stashSlots.length - 1; i >= 0 && remove; i--) {
      if (stashSlots[i].g === id) {
        stashSlots.splice(i, 1);
        remove--;
      }
    }
  }
  if (amount === count) delete stash[id];
  else stash[id] = count - amount;
  return true;
}

function stashConsume(materials) {
  if (!materials || typeof materials !== 'object' || Array.isArray(materials)) return false;
  const entries = Object.entries(materials);
  if (!entries.every(([id, n]) => Number.isSafeInteger(n) && n > 0 && stashCount(id) >= n)) return false;
  for (const [id, n] of entries) takeStashGoods(id, n);
  return true;
}

function selectedStashUnit() {
  if (!stashSelection) return null;
  const { id, uid } = stashSelection;
  if (uid === 'overflow') {
    if (!stashOverflowCount(id)) return null;
    return { uid, g: id, w: GOODS[id][1], h: GOODS[id][2] };
  }
  return stashSlots.find(s => s.uid === uid && s.g === id) || null;
}

function stashAtBunker() {
  return !raid || Boolean(field?.result);
}

function arrangeStashUnit(x, y, automatic = false) {
  const unit = selectedStashUnit();
  if (!unit || !stashAtBunker()) return false;
  const w = stashSelection.rot ? unit.h : unit.w;
  const h = stashSelection.rot ? unit.w : unit.h;
  const size = stashSize();
  const pos = automatic ? firstFit(stashSlots, size, w, h, unit.uid) : { x, y };
  if (!pos || !fits(stashSlots, size, pos.x, pos.y, w, h, unit.uid)) {
    stashNotice = '이 자리에 들어가지 않습니다. 다른 빈 칸을 고르거나 물품을 회전하세요.';
    return false;
  }
  if (unit.uid === 'overflow') {
    stashSlots.push({ uid: newStashUid(), g: unit.g, ...pos, w, h });
  } else {
    Object.assign(unit, pos, { w, h });
  }
  stashSelection = null;
  stashNotice = GOODS[unit.g][0] + ' 배치 완료';
  return true;
}

function stashGridMarkup() {
  const [cols, rows] = stashSize();
  let cells = '';
  for (let y = 0; y < rows; y++) {
    for (let x = 0; x < cols; x++) {
      cells += '<button class="slot" data-stash="place" data-x="' + x + '" data-y="' + y + '" style="grid-column:' + (x + 1) + ';grid-row:' + (y + 1) + '" aria-label="창고 ' + (x + 1) + '열 ' + (y + 1) + '행"></button>';
    }
  }
  const tiles = stashSlots.map(s => {
    const g = GOODS[s.g], chosen = stashSelection?.uid === s.uid;
    return `<button class="loot-tile ${chosen ? 'chosen' : ''}" data-stash="select" data-id="${s.g}" data-uid="${s.uid}" draggable="${stashAtBunker()}" aria-pressed="${chosen}" aria-label="${g[0]} · ${s.w}×${s.h} · ${s.x + 1}열 ${s.y + 1}행" title="${g[0]}" style="grid-column:${s.x + 1}/span ${s.w};grid-row:${s.y + 1}/span ${s.h}">${ico(g[4], 'item-symbol')}<span>${g[0]}</span></button>`;
  }).join('');
  return `<div class="spatial-grid stash-grid" data-stash-grid style="--cols:${cols};--rows:${rows}">${cells}${tiles}</div>`;
}

function stashSelectionMarkup() {
  const s = selectedStashUnit();
  if (!s) return '<h2>선택한 물품</h2><p>창고나 입고 대기 목록에서 물품을 선택하세요.</p>';
  const g = GOODS[s.g], canEdit = stashAtBunker(), rot = stashSelection.rot;
  const w = rot ? s.h : s.w, h = rot ? s.w : s.h;
  return `<div class="db-detail-title">${ico(g[4])}<div><h2>${g[0]}</h2><p>${g[5]} · ${w} × ${h}칸 · ${g[3]} kg</p></div></div>
    <div class="stash-tools">${canEdit ? `
      ${s.w !== s.h ? '<button data-stash="rotate" aria-pressed="' + rot + '">90° 회전</button>' : ''}
      ${rot && s.uid !== 'overflow' ? '<button data-stash="rotate-here">현재 위치에 적용</button>' : ''}
      ${s.uid === 'overflow' ? '<button data-stash="auto">빈 공간에 배치</button>' : ''}
      ${equipmentStashActions(s.g, s.uid)}
      <button data-stash="sell">1개 판매 · ${money(stashSalePrice(s.g))}</button>` : ''}
      <button data-db="lookup" data-id="${s.g}">도감 보기</button><button data-stash="clear">선택 해제</button>
    </div>${canEdit ? '<p>빈 칸을 누르면 그 칸을 왼쪽 위 모서리로 삼아 배치합니다.</p>' : ''}`;
}

function storagePage() {
  const [cols, rows] = stashSize(), capacity = cols * rows;
  const ids = Object.keys(stash).filter(id => stashCount(id));
  const total = ids.reduce((n, id) => n + stashCount(id), 0);
  const overflow = ids.map(id => [id, stashOverflowCount(id)]).filter(([, count]) => count > 0);

    <div class="db-summary stash-summary"><span>잔액 <b>${money(wallet)}</b> · 보관 ${total.toLocaleString('ko-KR')}개</span><button data-page="inventory">장비 관리</button><button data-page="bunker">하이드아웃</button></div>
    ${stashAtBunker() ? '' : '<p class="mini-field">작전 중입니다. 창고 정리와 판매는 귀환 후 이용할 수 있습니다.</p>'}
    <div class="stash-layout">
      <section class="loot-panel"><div class="field-label"><span>STORAGE</span><span>Lv.${hideoutLevel('stash')}</span></div><h2>보관 격자 <small>${cols} × ${rows} · ${occupied} / ${capacity}칸</small></h2>${total ? '' : '<p class="mini-field">창고가 비어 있습니다. 레이드에서 물품을 가방에 넣고 탈출하면 이곳에 보관됩니다.</p>'}${stashGridMarkup()}</section>
      <div class="stash-sidebar">

        <section class="panel"><h2>입고 대기 <small>${(total - stashSlots.length).toLocaleString('ko-KR')}개</small></h2>${overflow.length ? '<p>창고에 자리가 부족해 대기 중인 물품입니다. 물품을 선택해 배치하거나 사용할 수 있습니다.</p><div class="db-list stash-overflow">' + overflow.map(([id, n]) => `<button data-stash="select" data-uid="overflow" data-id="${id}" aria-pressed="${stashSelection?.uid === 'overflow' && stashSelection.id === id}">${ico(GOODS[id][4])}<span>${GOODS[id][0]}</span><b>×${n.toLocaleString('ko-KR')}</b></button>`).join('') + '</div>' : '<p>입고를 기다리는 물품이 없습니다.</p>'}</section>
      </div></div>`;

function handleStash(d) {
  const unit = selectedStashUnit();
  if (d.stash === 'select') {
    if (!stashCount(d.id)) return;
    stashSelection = { id: d.id, uid: d.uid, rot: false };
    stashNotice = '';
  } else if (d.stash === 'clear') {
    stashSelection = null;
    stashNotice = '';
  } else {
    if (!stashAtBunker() || !unit) return;
    let changed = false;
    if (d.stash === 'rotate') stashSelection.rot = !stashSelection.rot;
    if (d.stash === 'place') changed = arrangeStashUnit(Number(d.x), Number(d.y));
    if (d.stash === 'auto') changed = arrangeStashUnit(0, 0, true);
    if (d.stash === 'rotate-here') changed = arrangeStashUnit(unit.x, unit.y);
    if (d.stash === 'sell') {
      const price = stashSalePrice(unit.g);
      if (!Number.isSafeInteger(wallet + price) || !takeStashGoods(unit.g, 1, unit.uid)) return;
      wallet += price;
      stashNotice = `${GOODS[unit.g][0]} 1개 판매 · ${money(price)} 수령`;
      stashSelection = null;
      changed = true;
    }
    if (changed) persist();
  }
  renderKeep();
}

inside.addEventListener('click', event => {

inside.addEventListener('dragstart', event => {
  const tile = event.target.closest('[data-stash="select"][draggable="true"]');
  if (!tile || !stashAtBunker()) return;
  const unit = stashSlots.find(s => s.uid === tile.dataset.uid);
  if (!unit) return;
  const r = tile.getBoundingClientRect();
  const rot = stashSelection?.uid === unit.uid && stashSelection.rot;
  stashDrag = { id: unit.g, uid: unit.uid, rot, offsetX: rot ? 0 : Math.floor((event.clientX - r.left) * unit.w / r.width), offsetY: rot ? 0 : Math.floor((event.clientY - r.top) * unit.h / r.height) };
  event.dataTransfer.setData('text/plain', unit.uid);
  event.dataTransfer.effectAllowed = 'move';
});
inside.addEventListener('dragover', event => {

    event.preventDefault();
    event.dataTransfer.dropEffect = 'move';
  }
});
inside.addEventListener('drop', event => {
  const grid = event.target.closest('[data-stash-grid]');
  if (!grid || !stashDrag || !stashAtBunker()) return;
  event.preventDefault();
  const rect = grid.getBoundingClientRect(), [cols, rows] = stashSize();
  const x = Math.floor((event.clientX - rect.left - grid.clientLeft) * cols / grid.clientWidth) - stashDrag.offsetX;
  const y = Math.floor((event.clientY - rect.top - grid.clientTop) * rows / grid.clientHeight) - stashDrag.offsetY;
  stashSelection = { id: stashDrag.id, uid: stashDrag.uid, rot: stashDrag.rot };
  stashDrag = null;
  if (arrangeStashUnit(x, y)) persist();
  renderKeep();
});
inside.addEventListener('dragend', () => { stashDrag = null; });

// Facility levels, building sites, and production jobs share the raid save.
let hideout;
let hideoutMessage = '';
function loadHideout(saved) {
  hideout = {levels:{}, builds:{}, production:{}, history:[]};
  for (const [id, facility] of Object.entries(FACILITIES)) {
    const max = facility.levels.length;
    const level = saved?.levels?.[id];
    hideout.levels[id] = Number.isInteger(level) && level >= 0 && level <= max ? level : 0;
    const build = saved?.builds?.[id];
    if (build?.tier === hideout.levels[id] + 1 && build.tier <= max && Number.isSafeInteger(build.end) && build.end > 0) {
      hideout.builds[id] = {tier:build.tier, end:build.end};
    }
    const order = saved?.production?.[id];
    if (Number.isInteger(order?.recipe) && order.recipe >= 0 && order.recipe < hideout.levels[id] && FACILITY_PRODUCTION[id]?.[order.recipe] && Number.isSafeInteger(order.end) && order.end > 0) {
      hideout.production[id] = {recipe:order.recipe, end:order.end};
    }
  }
  if (Array.isArray(saved?.history)) hideout.history = saved.history.filter(s => typeof s === 'string').slice(0, 5);
}
function hideoutLevel(id) { return hideout?.levels?.[id] || 0; }
function hideoutRecoveryBonus(stat) { return hideoutLevel({hp:'med',energy:'kitchen',water:'water'}[stat]) * 3; }
function adjustHideoutActionMs(type, ms) {
  const percent = type === 'scan' ? hideoutLevel('light') * 8 : type === 'move' ? hideoutLevel('rest') * 5 : 0;
  return Math.round(ms * (100 - percent) / 100);
}
function productionMs(recipe) {
  return Math.round(recipe.minutes * 60000 * (100 - hideoutLevel('vent') * 5) / 100);
}
function facilityEffect(id, level) {
  const passives = {
    power:`동시 건설 가능 시설 ${level + 1}곳`,
    light:`레이드 주변 탐색 시간 ${level * 8}% 단축`,
    vent:`새로 시작하는 생산·의뢰 소요 시간 ${level * 5}% 단축`,
    stash:`격자 창고 6 × ${8 + level * 2}칸 · 기본보다 ${level * 12}칸 확장`,
    rest:`레이드 지역 이동 시간 ${level * 5}% 단축`
  };
  if (passives[id]) return passives[id];
  const bonus = {med:'의료품 체력 회복',water:'음료 수분 회복',kitchen:'식량 기력 회복'}[id];
  return `${FACILITY_PRODUCTION[id][level - 1].name} 이용 가능${bonus ? ' · ' + bonus + ' +' + level * 3 : ''}`;
}
function facilityReceipt(s) {
  hideoutMessage = '';
  hideout.history.unshift(s);
  hideout.history.length = Math.min(5, hideout.history.length);
}
function advanceHideout(now = Date.now()) {
  if (!hideout) return false;
  let changed = false;
  for (const [id, job] of Object.entries(hideout.builds)) {
    if (now < job.end) continue;
    hideout.levels[id] = job.tier;
    delete hideout.builds[id];
    if (id === 'stash') refreshStashLayout();
    facilityReceipt(`${FACILITIES[id].name} Lv.${job.tier} 건설 완료`);
    changed = true;
  }
  for (const [id, job] of Object.entries(hideout.production)) {
    if (now < job.end) continue;
    const recipe = FACILITY_PRODUCTION[id][job.recipe];
    for (const [item, qty] of Object.entries(recipe.outputs || {})) addStashGoods(item, qty);
    if (recipe.reward) wallet += recipe.reward;
    delete hideout.production[id];
    facilityReceipt(`${recipe.name} 완료 · ${productionResult(recipe)} 지급`);
    changed = true;
  }
  return changed;
}
function missingMaterials(inputs) {
  return Object.entries(inputs).some(([id,qty]) => stashCount(id) < qty);
}
function facilityBuildStatus(id, tier) {
  const f = FACILITIES[id];
  const step = f?.levels[tier - 1];
  if (!step) return '잘못된 시설 단계';
  if (hideoutLevel(id) >= tier) return '건설 완료';
  if (hideout.builds[id]) return '공사 진행 중';
  if (hideout.production[id]) return '시설 작업 진행 중';
  if (tier !== hideoutLevel(id) + 1) return '이전 단계 건설 필요';
  if (step.requires.some(r => hideoutLevel(r.facility) < r.level)) return '선행 시설 필요';
  if (raid) return '귀환 후 건설 가능';
  if (Object.keys(hideout.builds).length >= hideoutLevel('power') + 1) return '동시 건설 한도 도달';
  if (wallet < step.costCR) return '건설 자금 부족';
  if (missingMaterials(step.materials)) return '창고 재료 부족';
  return '';
}
function productionStatus(id,index) {
  if (!FACILITY_PRODUCTION[id]?.[index] || index >= hideoutLevel(id)) return '시설 단계 부족';
  if (hideout.builds[id]) return '건설 진행 중';
  if (hideout.production[id]) return '작업 진행 중';
  if (raid) return '귀환 후 작업 가능';
  return missingMaterials(FACILITY_PRODUCTION[id][index].inputs) ? '재료 부족' : '';
}
function productionResult(recipe) {
  const goods = Object.entries(recipe.outputs || {}).map(([id,n]) => `${GOODS[id][0]} ×${n}`);
  if (recipe.reward) goods.push(recipe.reward.toLocaleString('ko-KR') + ' CR');
  return goods.join(' · ');
}
function handleHideout(d) {
  const id = d.id;
  if (!Object.hasOwn(FACILITIES,id)) return;
  reconcile();
  let message = '';

function kitWearStash(id,uid) {

function kitPackFromStash(id,uid) {

function handleEquipment(d) {
  reconcile();
  const active=Boolean(raid),k=currentKit(),a=d.gear;
  if(active&&(field.result||field.action||((field.contact||field.journey)&&a!=='consume'))){gearNotice=field.action?'진행 중인 행동이 끝나면 장비를 변경할 수 있습니다.':'이동·교전 중에는 가방에 있는 소모품만 사용할 수 있습니다.';renderKeep();return;}
  switch(a){
    case 'issue':
      if(!active&&!k.worn.back){k.worn.back=ISSUE_PACK;gearNotice='지급 배낭을 착용했습니다.';}
      break;
    case 'wear-stash': kitWearStash(d.id,d.unit);break;
    case 'pack': kitPackFromStash(d.id,d.unit);break;
    case 'wear-bag': kitWearBag(d.unit);break;
    case 'unwear': if(!active)removeWorn(d.slot,false);break;
    case 'ground-worn': if(active)removeWorn(d.slot,true);break;
    case 'buy':{
      const id=d.id;if(active||![KIT_START_PRIMARY,KIT_ARMOR,KIT_LARGE_PACK].includes(id))return;
      const cost=GOODS[id][6];if(wallet<cost){gearNotice='잔액이 부족합니다.';break;}
      if(addStashGoods(id,1)){wallet-=cost;gearNotice=kitName(id)+' 구입 · 창고 보관.';}
      break;
    }
    case 'drop':
    case 'consume': {
      if(!active)return;
      const index=k.bag.findIndex(o=>o.uid===d.unit);if(index<0)return;
      const item=k.bag[index];
      if(a==='consume'){
        const effect=kitSupply(item.g);if(!effect)return;
        const value=k[effect.stat]??100;
        if(value>=100){gearNotice=effect.label+'이 이미 최대입니다.';break;}
        k[effect.stat]=Math.min(100,value+effect.gain);
        gearNotice=kitName(item.g)+' 사용 · '+effect.label+' +'+(k[effect.stat]-value);
      }else{
        kitGround().push(item);gearNotice=kitName(item.g)+' · 이 지역에 내려놓았습니다.';
      }
      k.bag.splice(index,1);picked=null;logField(gearNotice);break;
    }
    case 'recover':{
      if(!active)return;
      const ground=kitGround(),i=ground.findIndex(o=>o.uid===d.unit);
      if(i<0)return;
      const o=ground[i];
      if(o.g===ISSUE_PACK){
        if(k.worn.back){gearNotice='현재 배낭을 먼저 내려놓으세요.';break;}
        k.worn.back=ISSUE_PACK;
      }else if(kitSlot(o.g)==='back'&&!k.worn.back){
        k.worn.back=o.g;
      }else{
        const fit=kitFit(k.bag,kitCapacity(k.worn),o);
        if(!fit){gearNotice='가방에 공간이 부족합니다.';break;}
        k.bag.push(fit);
      }
      ground.splice(i,1);gearNotice=kitName(o.g)+' 회수.';break;
    }
    case 'select':
      if(!active&&k.bag.some(o=>o.uid===d.unit)){gearPick={uid:d.unit,rot:false};gearNotice='';}
      break;
    case 'prep-rotate': if(!active&&gearPick)gearPick.rot=!gearPick.rot;break;
    case 'cell': if(!active)kitPrepMove(Number(d.x),Number(d.y));break;
    case 'unpack': {
      if(active)return;
      const i=k.bag.findIndex(o=>o.uid===gearPick?.uid);
      if(i>=0){const id=k.bag[i].g;if(addStashGoods(id,1)){k.bag.splice(i,1);gearPick=null;gearNotice=kitName(id)+' 창고 보관.';}}
      break;
    }
    default:return;
  }
  notice=gearNotice;if(typeof page!=='undefined'&&page==='stash')stashNotice=gearNotice;persist();renderKeep();
}

function validateEquipmentBackup(snapshot){
  const dict=value=>value && typeof value==='object'&&!Array.isArray(value);
  const validWorn=value=>dict(value)&&Object.entries(value).every(([slot,id])=>
    Object.hasOwn(KIT_SLOTS,slot)&&typeof id==='string'&&kitSlot(id)===slot);
  const validUnit=(u,ground=false)=>{
    if(!dict(u)||typeof u.g!=='string'||typeof u.uid!=='string'||!/^[a-zA-Z0-9_-]{1,100}$/.test(u.uid))return false;
    if(ground&&u.g===ISSUE_PACK)return u.w===1&&u.h===1;
    if(!Object.hasOwn(GOODS,u.g))return false;
    const g=GOODS[u.g];
    return (u.w===g[1]&&u.h===g[2]||u.w===g[2]&&u.h===g[1])&&u.revealed===true;
  };
  const positionValid=(bag,worn)=>{
    if(!Array.isArray(bag)||bag.length>48)return false;
    const occupied=[],uids=new Set(),size=kitCapacity(worn);
    for(const u of bag){
      if(!validUnit(u)||uids.has(u.uid)||!fits(occupied,size,u.x,u.y,u.w,u.h))return false;
      occupied.push(u);uids.add(u.uid);
    }
    return true;
  };
  const k=snapshot.equipment,f=snapshot.field;
  if(!dict(k)||!validWorn(k.worn)||!positionValid(k.bag,k.worn)||!dict(f))return false;
  if(snapshot.raid&&!f.result){
    if(!validWorn(f.worn)||!positionValid(f.bag,f.worn))return false;
    if(k.bag.length||Object.keys(k.worn).length)return false;
    if(!Array.isArray(f.gearGround)||f.gearGround.length!==FIELD_ZONES.length)return false;
    const ids=new Set(f.bag.map(x=>x.uid));
    for(const ground of f.gearGround){
      if(!Array.isArray(ground))return false;
      for(const u of ground){
        if(!validUnit(u,true)||ids.has(u.uid))return false;
        ids.add(u.uid);
      }
    }
  }
  return true;
}

const LANDMARKS = LANDMARK_LAYOUT.map((points,z)=>points.map(([name,description,...entries])=>({
  name, description, boxes:entries.map(entry=>typeof entry==='number'?entry:FIELD_ZONES[z].boxes.push(entry)-1)
})));

function validLandmarkSelection(f) {
  return f.landmarkByZone == null || (Array.isArray(f.landmarkByZone) && f.landmarkByZone.length === LANDMARKS.length &&
    f.landmarkByZone.every((index,z)=>Number.isInteger(index) && index>=0 && index<LANDMARKS[z].length));
}

function prepareLandmarks() {
  if(!raid || (field.landmarkByZone && validLandmarkSelection(field)))return;
  field.landmarkByZone=[0,0,0];
  const z=raid.zone;
  let box=-1;
  if(field.open)box=Number(field.open.split('-')[1]);
  else if(field.action?.type==='scan') {
    // v0.10 discovered containers in zone-wide order. Complete that search in its original location.
    box=FIELD_ZONES[z].boxes.findIndex((_,i)=>i<6 && !field.found[z].includes(i));
  }
  if(box>=0) {
    const point=LANDMARKS[z].findIndex(p=>p.boxes.includes(box));
    if(point>=0)field.landmarkByZone[z]=point;
  }
}

function currentLandmark(z=raid.zone) {
  return LANDMARKS[z][field.landmarkByZone?.[z]??0];
}

function nextLandmarkBox(z=raid.zone) {
  return currentLandmark(z).boxes.find(i=>!field.found[z].includes(i))??-1;
}

function selectLandmark(index) {
  if(!isActive() || field.journey || field.action || field.contact || field.open ||
    !Number.isInteger(index) || !LANDMARKS[raid.zone][index])return;
  prepareLandmarks();
  field.landmarkByZone[raid.zone]=index;
  picked=null;notice='';
  persist();renderKeep();
}

function landmarkPanel(){
  const zi=raid.zone, area=FIELD_ZONES[zi], point=currentLandmark(), busy=!!field.action;
  const visible=point.boxes.filter(i=>field.found[zi].includes(i));
  const options=LANDMARKS[zi].map((p,i)=>{
    const completed=p.boxes.filter(k=>field.boxes[boxKey(zi,k)]?.complete).length;
    return `<button data-field="landmark" data-index="${i}" aria-pressed="${p===point}" ${busy?'disabled':''}><span>${p.name}</span><small>${completed} / ${p.boxes.length} 수색 완료</small></button>`;
  }).join('');
  const cards=visible.map(i=>{
    const [name,icon]=area.boxes[i], box=field.boxes[boxKey(zi,i)];
    const label=box.complete?'수색 완료':box.items.some(x=>x.revealed)?'일부 확인':'미수색';
    return `<button class="container-card" data-field="open" data-index="${i}" ${busy?'disabled':''}>${ico(icon)}<b>${name}</b><small>${label}</small></button>`;
  }).join('');
  return `<section class="field-section landmark-site">
    <div class="landmark-header"><div><small>현재 랜드마크</small><h2>${point.name}</h2></div>
      <details class="landmark-picker"><summary>랜드마크 선택 · ${LANDMARKS[zi].length}곳</summary>
        <div class="landmark-list">${options}</div></details></div>
    <p class="landmark-description">${point.description}</p>
    <button class="primary search-button" data-field="scan" ${busy||nextLandmarkBox()<0?'disabled':''}>${ico('search')} 주변 탐색 <small>${durationLabel('scan',4000)}</small></button>
    <h3 class="landmark-box-title">발견한 수색 대상 <small>${visible.length} / ${point.boxes.length}</small></h3>
    <div class="container-list">${cards||'<p class="empty-field">주변을 탐색해 이곳의 수색 대상을 발견하세요.</p>'}</div>
  </section>`;
}

const MAP_LINKS = [[0,1],[1,2],[0,2]];

function routeMap(z,interactive) {
  const edges=MAP_LINKS.map(([from,to])=>{
    const [x1,y1]=MAP_STATIONS[from],[x2,y2]=MAP_STATIONS[to],steps=routeDistance(from,to);
    const active=field?.journey&&[from,to].includes(field.journey.from)&&[from,to].includes(field.journey.to);
    let pips='';
    for(let i=1;i<=steps;i++){
      // Place pips between the station labels, clear of either endpoint.
      const t=.12+.76*i/(steps+1),x=x1+(x2-x1)*t,y=y1+(y2-y1)*t;
      const completed=active&&(field.journey.from===from?i:steps-i+1)<=field.journey.done;
      pips+=`<circle class="route-pip${completed?' passed':''}" cx="${x}" cy="${y}" r="4.7"/>`;
    }
    return `<g class="route-line${active?' on-route':''}" data-distance="${steps}"><path d="M${x1} ${y1}L${x2} ${y2}"/>${pips}</g>`;
  }).join('');
  const stations=MAP_STATIONS.map(([x,y],i)=>{
    const content=`<b>${FIELD_ZONES[i].name}</b><small>랜드마크 ${LANDMARKS[i].length}곳</small>`;
    const style=`left:${x/360*100}%;top:${y/250*100}%`;
    return interactive?`<button type="button" class="route-station" style="${style}" data-zone="${i}" aria-pressed="${i===z}">${content}</button>`:
      `<div class="route-station" style="${style}" ${i===z?'aria-current="location"':''}>${content}</div>`;
  }).join('');
  return `<div class="route-map-wrap"><div class="route-plot">
    <svg viewBox="0 0 360 250" aria-hidden="true" class="route-chart">
      <g class="contour"><path d="M-12 205Q28 165 25 125T5 39M-4 218Q45 176 38 126T16 29M5 231Q61 187 51 128T27 18M17 243Q77 202 64 131T41 13M235 -9Q205 28 218 48T264 95Q300 113 328 96T375 86M248 -9Q219 26 232 47T271 83Q299 100 328 85T375 71M262 -9Q233 22 246 45T281 72Q301 86 327 72T375 58M237 249Q248 211 282 204T373 185M252 255Q261 225 285 219T375 201"/></g>
      ${edges}
    </svg>${stations}</div>
    <p class="route-key"><i aria-hidden="true"></i> 작은 원 하나가 이동 거리 1칸입니다.</p></div>`;
}

// Intermediate circles measure travel distance. Only the two endpoints are regions.
const ROUTE_DISTANCE = [
  [0, 1, 3],
  [1, 0, 2],
  [3, 2, 0]
];
const TRAVEL_STEP_MS = 8000;
const ROAD_SUPPLIES = [
  {tpl:'water', relativeProbability:27}, {tpl:'bandage', relativeProbability:23},
  {tpl:'food', relativeProbability:17}, {tpl:'wire', relativeProbability:13},
  {tpl:'battery', relativeProbability:9}, {tpl:'tape', relativeProbability:7},
  {tpl:'medkit', relativeProbability:4}
];

function routeDistance(from,to){
  return ROUTE_DISTANCE[from]?.[to] || 0;
}
function routeTimeLabel(from,to){
  const steps=routeDistance(from,to);
  const seconds=steps*actionDuration('move',TRAVEL_STEP_MS)/1000;
  return steps+'칸 · '+seconds.toLocaleString('ko-KR')+'초';
}
function queueJourneyStep(at){
  // Commit the roll with the timer so closing the game cannot replace it.
  const roll=Math.random();
  const outcome=roll<0.55?'clear':roll<0.80?'supply':'contact';
  field.action={
    type:'travel-step',start:at,end:at+actionDuration('move',TRAVEL_STEP_MS),
    outcome,supply:outcome==='supply'?weightedChoice(ROAD_SUPPLIES).tpl:null
  };
}
function startJourney(to){
  if(!isActive()||field.action||field.contact||field.journey||!Number.isInteger(to)||!routeDistance(raid.zone,to))return;
  field.journey={from:raid.zone,to,done:0,event:null,supply:null};
  field.open=null;picked=null;dragged=null;notice='';exitNotice='';
  logField(FIELD_ZONES[to].name+' 방면 출발 · '+routeDistance(raid.zone,to)+'칸.');
  queueJourneyStep(Date.now());
  persist();renderKeep();
}
function resumeJourney(at){
  const j=field.journey;
  if(!j)return;
  j.event=null;j.supply=null;
  if(j.done<routeDistance(j.from,j.to)){queueJourneyStep(at);return}
  raid.zone=j.to;zone=j.to;
  if(!field.visited.includes(j.to))field.visited.push(j.to);
  logField(FIELD_ZONES[j.to].name+' 도착.');
  field.journey=null;field.action=null;
}
function finishJourneyStep(action){
  const j=field.journey;
  field.action=null;
  if(!j)return;
  j.done++;
  field.energy=Math.max(0,field.energy-3);
  if(sufferExhaustion(action.end))return;
  if(action.outcome==='supply'){
    j.event='supply';j.supply=action.supply;
    logField(j.done+'칸째 보급 발견 · '+GOODS[j.supply][0]+'.');
  }else if(action.outcome==='contact'){
    j.event='contact';field.contact={zone:j.to,hp:CONTACTS[j.to].hp};
    logField(j.done+'칸째 '+CONTACTS[j.to].name+' 조우.');
  }else{
    logField(j.done+'칸째 무사 통과.');
    resumeJourney(action.end);
  }
}
function roadSupplyPlacement(id){
  const item=GOODS[id];
  return kitFit(field.bag,raidBagSize(),{g:id,x:0,y:0,w:item[1],h:item[2]});
}
function handleJourneyField(d){
  const j=field.journey;
  if(!isActive()||!j||j.event!=='supply'||field.action||field.contact)return;
  if(d.field==='journey-take'){
    const placement=roadSupplyPlacement(j.supply);
    if(!placement)return;
    field.bag.push({...kitUnit(j.supply),...placement});
    logField(GOODS[j.supply][0]+' 1개를 가방에 담았습니다.');
  }else if(d.field==='journey-pass'){
    logField('보급품을 두고 이동합니다 · '+GOODS[j.supply][0]+'.');
  }else return;
  resumeJourney(Date.now());
  persist();renderKeep();
}
function journeyProgress(){
  const j=field.journey;
  if(!j)return '';
  const total=routeDistance(j.from,j.to);
  const marked=j.event?j.done:j.done+1;
  const dots=Array.from({length:total},(_,i)=>{
    const step=i+1;
    const state=step===marked?'current':step<marked?'passed':'ahead';
    return '<span class="journey-dot '+state+'" aria-hidden="true">'+step+'</span>';
  }).join('');
  return '<div class="journey-track"><div class="journey-endpoints"><b>'+FIELD_ZONES[j.from].name+'</b><span class="journey-dots">'+dots+'</span><b>'+FIELD_ZONES[j.to].name+'</b></div><p>'+marked+' / '+total+'칸 · '+(j.event==='contact'?'적 조우':j.event==='supply'?'보급 발견':'이동 중')+'</p></div>';
}
function journeyPage(){
  const j=field.journey, supply=j.event==='supply'?GOODS[j.supply]:null;
  let eventPanel='';
  if(supply){
    const fitsInBag=Boolean(roadSupplyPlacement(j.supply));
    eventPanel='<section class="panel road-supply"><div class="kit-heading"><h2>길에서 발견한 보급품</h2>'+ico(supply[4])+'</div>'+
      '<p><strong>'+supply[0]+'</strong> · '+supply[1]+'×'+supply[2]+'칸 · '+supply[3]+' kg</p>'+
      (!fitsInBag?'<p>가방 공간이 부족합니다. 가방을 정리하거나 보급품을 두고 진행하세요.</p>':'')+
      '<div class="contact-buttons"><button class="primary" data-field="journey-take" '+(fitsInBag?'':'disabled')+'>가방에 담고 진행</button>'+
      '<button data-field="journey-pass">두고 진행</button><button data-page="inventory">가방 확인</button></div></section>';
  }
  return head('FIELD / TRAVEL',FIELD_ZONES[j.to].name+' 방면',supply?'보급품을 어떻게 할지 선택하세요.':'다음 칸까지 이동하고 있습니다.')+
    journeyProgress()+actionMarkup()+eventPanel+
    '<section class="field-section"><h2>현장 기록</h2><div class="field-log">'+field.log.slice(0,4).map(l=>'<p>'+esc(l)+'</p>').join('')+'</div></section>';
}
function validJourneyBackup(snapshot){
  const f=snapshot.field,j=f.journey,a=f.action;
  if(a?.type==='evade'&&a.escaped!==undefined&&typeof a.escaped!=='boolean')return false;
  if(j==null)return a?.type!=='travel-step';
  if(!snapshot.raid||f.result||f.open!=null||typeof j!=='object'||!Number.isInteger(j.from)||!Number.isInteger(j.to)||j.from!==snapshot.raid.zone)return false;
  const total=routeDistance(j.from,j.to);
  if(!total||!Number.isInteger(j.done)||j.done<0||j.done>total)return false;
  const supplyID=id=>ROAD_SUPPLIES.some(entry=>entry.tpl===id);
  if(j.event===null){
    if(j.done>=total||j.supply!==null||f.contact!=null||a?.type!=='travel-step')return false;
    if(!['clear','supply','contact'].includes(a.outcome))return false;
    return a.outcome==='supply'?supplyID(a.supply):a.supply===null;
  }
  if(j.done===0)return false;
  if(j.event==='supply')return supplyID(j.supply)&&a==null&&f.contact==null;
  return j.event==='contact'&&j.supply===null&&f.contact?.zone===j.to&&(a==null||['engage','evade'].includes(a.type));
}

const SAVE11='rl-reboot-session-v11';
const SAVE10='rl-reboot-session-v10';
let writer=false, revision=0, saveMessage='';
function readSession(){
  const current=getJSON(SAVE11), previous=current?null:getJSON(SAVE10), snap=current||previous||getJSON(SAVE09);
  revision=current?.revision||0;
  stash=Object.fromEntries(Object.entries(snap?.stash||{}).filter(([id,q])=>Object.hasOwn(GOODS,id)&&Number.isSafeInteger(q)&&q>0));
  wallet=Number.isSafeInteger(snap?.wallet)&&snap.wallet>=0?snap.wallet:30000;
  lastSummary=snap?.lastSummary||null;
  const r=snap?snap.raid:getJSON(RAID_KEY);
  raid=r&&Number.isSafeInteger(r.startedAt)&&Number.isSafeInteger(r.endsAt)&&r.endsAt-r.startedAt===RAID_DURATION_MS&&Number.isInteger(r.zone)&&FIELD_ZONES[r.zone]?r:null;
  const f=snap?snap.field:getJSON(FIELD_KEY);
  field=f&&f.raidId===(raid?.startedAt||0)&&Array.isArray(f.bag)&&Array.isArray(f.found)&&f.boxes&&Array.isArray(f.log)?f:freshField();
  if(raid&&!Array.isArray(field.visited))field.visited=[raid.zone];
  if(raid)for(const box of Object.values(field.boxes)){
    if(!Array.isArray(box.size))box.size=BOX_SIZE.slice();
  }
  readCareer(snap?.career);
  loadHideout(snap?.hideout);
  loadStashLayout(snap?.stashSlots);
  loadEquipment(snap?.equipment);
  // An empty pack already qualified a v0.9 tunnel countdown before gear slots existed.
  if(!current&&!previous&&raid&&!field.result&&field.action?.type==='extract'&&field.action.exit==='tunnel'&&!field.bag.length&&field.worn.back===ISSUE_PACK){
    delete field.worn.back;
    field.gearGround[raid.zone].push(kitUnit(ISSUE_PACK));
  }
  prepareLandmarks();
  prepareSortie(true);
}
function snapshot(){return {version:11,revision,raid,field,stash,stashSlots,wallet,lastSummary,career,equipment:equipmentState,hideout}}
function writeSession(){
  if(!writer)return;
  const disk=getJSON(SAVE11);
  if(disk&&disk.revision!==revision){
    readSession();saveMessage='다른 탭에서 저장한 최신 기록을 불러왔습니다.';return;
  }
  revision++;putJSON(SAVE11,snapshot());
}
function enableSession(){
  writer=true;document.documentElement.classList.remove('read-only');readSession();
  if(raid)seedContainers();
  if(raid&&field.result==='expired'&&lastSummary?.raidId!==raid.startedAt)finishRaid('expired',raid.endsAt);
  reconcile();persist();if(view==='inside')renderKeep();
}
function startSession(){
  readSession();
  let locks;
  try{locks=navigator.locks}catch{}
  if(!locks){enableSession();return}
  document.documentElement.classList.add('read-only');
  try{
    // Keep one writer across an open v0.10 tab and the v0.11 migration.
    locks.request(SAVE10,async()=>{
      enableSession();
      await new Promise(resolve=>window.addEventListener('pagehide',resolve,{once:true}));
      writer=false;
    }).catch(()=>{if(!writer)enableSession()});
  }catch{enableSession()}
}
function backupPanel(){
  return '<section class="panel save-panel"><h2>플레이 기록</h2><p>기록은 현재 브라우저에 저장됩니다. 다른 기기나 파일로 옮길 때 백업을 사용하세요.</p>'+
    '<button data-backup="export">백업 내려받기</button><button data-backup="import">백업 불러오기</button><input type="file" id="restore-file" accept=".json,application/json" hidden>'+
    '<p role="status">'+esc(saveMessage)+'</p></section>';
}
function exportSave(){
  if(!writer)return;
  reconcile();
  const url=URL.createObjectURL(new Blob([JSON.stringify({format:'rustline-tc01',session:snapshot()})],{type:'application/json'}));
  const a=document.createElement('a');a.href=url;a.download='Rustline_save_v11.json';document.body.append(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),10000);
}
function validateBackup(raw){
  if(!raw||raw.format!=='rustline-tc01')return false;
  const s=raw.session, dict=o=>o&&typeof o==='object'&&!Array.isArray(o);
  const integer=(n,min=0,max=Number.MAX_SAFE_INTEGER)=>Number.isSafeInteger(n)&&n>=min&&n<=max;
  const id=x=>typeof x==='string'&&Object.hasOwn(GOODS,x);
  const tile=o=>dict(o)&&id(o.g)&&typeof o.uid==='string'&&/^[a-z0-9_-]{1,100}$/i.test(o.uid)&&integer(o.x,0,40)&&integer(o.y,0,40)&&integer(o.w,1,20)&&integer(o.h,1,20);
  if(!dict(s)||![10,11].includes(s.version)||!integer(s.wallet)||!dict(s.stash)||!Object.entries(s.stash).every(([k,n])=>id(k)&&integer(n,1))||!Array.isArray(s.stashSlots)||!s.stashSlots.every(tile))return false;
  // All strings in an exported snapshot are plain text. Reject markup or reserved object keys before rendering a supplied file.
  function plain(v,depth=0){
    if(depth>12)return false;
    if(typeof v==='string')return v.length<2500&&!/[<>&"`]/.test(v);
    if(v===null||typeof v==='boolean')return true;
    if(typeof v==='number')return Number.isFinite(v);
    return typeof v==='object'&&Object.entries(v).every(([k,x])=>!['__proto__','prototype','constructor'].includes(k)&&/^[\w-]+$/.test(k)&&plain(x,depth+1));
  }
  if(!plain(s)||!dict(s.field)||!dict(s.equipment)||!dict(s.hideout)||!dict(s.career))return false;
  if(!validateEquipmentBackup(s))return false;
  const r=s.raid,f=s.field;
  if(r!==null&&(!dict(r)||!integer(r.startedAt,1)||r.endsAt-r.startedAt!==RAID_DURATION_MS||!integer(r.zone,0,2)))return false;
  if(f.raidId!==(r?.startedAt||0)||!Array.isArray(f.bag)||!f.bag.every(tile)||!Array.isArray(f.found)||f.found.length!==3||!f.found.every((a,z)=>Array.isArray(a)&&a.every(i=>integer(i,0,FIELD_ZONES[z].boxes.length-1))))return false;
  if(!Array.isArray(f.log)||!f.log.every(x=>typeof x==='string')||!dict(f.boxes))return false;
  function validBoxKey(key){
    if(!/^[0-2]-(0|[1-9]\d*)$/.test(key))return false;
    const [z,i]=key.split('-').map(Number);
    return i<FIELD_ZONES[z].boxes.length;
  }
  if(!validLandmarkSelection(f)||!validJourneyBackup(s))return false;
  if(!Object.entries(f.boxes).every(([k,b])=>validBoxKey(k)&&b?.key===k&&Array.isArray(b.items)&&b.items.every(tile)&&Array.isArray(b.size)&&b.size.length===2&&b.size.every(n=>integer(n,1,20))))return false;
  if(f.result!=null&&!Object.hasOwn(ENDINGS,f.result))return false;
  if(f.contact!=null&&(!integer(f.contact.zone,0,2)||!integer(f.contact.hp,1,100)))return false;
  if(r&&(!Array.isArray(f.visited)||!Array.isArray(f.exits)||!f.exits.every(k=>!!exitBy(k))))return false;
  if(f.open!=null&&!f.boxes[f.open])return false;
  const a=f.action;
  if(a!=null){
    if(!r||!dict(a)||!['travel-step','move','scan','search','engage','evade','extract'].includes(a.type)||!integer(a.start)||!integer(a.end)||a.start>a.end)return false;
    if(a.type==='move'&&!integer(a.zone,0,2)||a.type==='search'&&!f.boxes[a.key]||a.type==='extract'&&!exitBy(a.exit))return false;
  }
  const summary=s.lastSummary;
  if(summary&&(!dict(summary)||!Array.isArray(summary.goods)||!summary.goods.every(id)||!integer(summary.elapsed)||!integer(summary.cost)||!Object.hasOwn(ENDINGS,summary.result)))return false;
  if(summary?.worn&&(!Array.isArray(summary.worn)||!summary.worn.every(x=>dict(x)&&Object.hasOwn(KIT_SLOTS,x.slot)&&kitSlot(x.id)===x.slot)))return false;
  return Array.isArray(s.career.done)&&Array.isArray(s.career.history)&&s.career.history.every(row=>dict(row)&&Object.hasOwn(ENDINGS,row.rating)&&integer(row.elapsed)&&integer(row.xp));
}
async function importSave(file){
  if(!file||!writer)return;
  let data;
  try{if(file.size>4000000)throw Error();data=JSON.parse(await file.text());if(!validateBackup(data))throw Error()}
  catch{saveMessage='읽을 수 없는 백업입니다. 러스트라인 v0.10 또는 v0.11 백업 파일을 선택하세요.';renderKeep();return}
  if(!writer||!confirm('현재 플레이 기록을 선택한 백업으로 교체할까요?'))return;
  try{localStorage.setItem(SAVE11,JSON.stringify({...data.session,version:11,revision:revision+1}))}
  catch{saveMessage='브라우저가 저장을 허용하지 않았습니다.';renderKeep();return}
  readSession();if(raid)seedContainers();reconcile();persist();saveMessage='백업을 복원했습니다.';renderKeep();
}

const money=n=>n.toLocaleString('ko-KR')+' CR';
function itemSources(id){return ITEM_META[id].lootSources.map(t=>LOOT_TABLES[t].name).join(' · ')}
function catalogRows(){return Object.entries(GOODS).filter(([id,g])=>(!catalogCategory||g[5]===catalogCategory)&&(!catalogQuery||[id,g[0],g[5],ITEM_META[id].usage,itemSources(id)].join(' ').toLowerCase().includes(catalogQuery.toLowerCase()))).sort((a,b)=>a[1][0].localeCompare(b[1][0],'ko'))}
function catalogResults(){const rows=catalogRows(),max=Math.max(0,Math.floor((rows.length-1)/24)*24);catalogOffset=Math.min(catalogOffset,max);return `<div class="db-summary"><span>${rows.length}종 · ${rows.length?catalogOffset+1:0}–${Math.min(catalogOffset+24,rows.length)}</span><button data-db="prev" ${catalogOffset===0?'disabled':''}>이전</button><button data-db="next" ${catalogOffset+24>=rows.length?'disabled':''}>다음</button></div><div class="db-list">${rows.slice(catalogOffset,catalogOffset+24).map(([id,g])=>`<button data-db="item" data-id="${id}" aria-pressed="${catalogSelected===id}">${ico(g[4])}<span><b>${g[0]}</b><small>${g[5]} · ${g[1]}×${g[2]} · ${g[3]} kg</small></span><span>${money(g[6])}</span></button>`).join('')||'<p>검색 결과가 없습니다.</p>'}</div>`}
function catalogDetail(){if(!catalogSelected||!GOODS[catalogSelected])return '<p>물품을 선택하면 루팅 장소와 시설 사용처가 표시됩니다.</p>';const id=catalogSelected,g=GOODS[id],m=ITEM_META[id];return `<div class="db-detail-title">${ico(g[4])}<div><h2>${g[0]}</h2><p>${g[5]} · ${m.rarity} (임시 밸런스)</p></div></div><p>${g[1]}×${g[2]} 칸 · ${g[3]} kg · ${money(g[6])}</p><h3>사용처</h3><p>${m.usage}</p><h3>루팅 가능한 컨테이너</h3><p>${itemSources(id)}</p><h3>시설 요구 재료</h3>${m.hideoutUses.length?m.hideoutUses.map(u=>`<button class="db-link" data-db="facility" data-id="${u.facility}" data-tier="${u.level}">${FACILITIES[u.facility].name} Lv.${u.level} · ${u.quantity}개 ›</button>`).join(''):'<p>현재 시설 요구 재료에는 포함되지 않습니다.</p>'}<p class="mono">${id}</p>${supplyPanel(id)}`}
function catalogPage(){const cats=[...new Set(Object.values(GOODS).map(g=>g[5]))].sort((a,b)=>a.localeCompare(b,'ko'));return head('06 / ITEM DATABASE','물품 도감','503종 물품 · 루팅 출처 및 시설 요구 재료 확인')+`<button data-page="bunker">‹ 하이드아웃</button><div class="db-layout"><section class="panel"><div class="db-filters"><label>이름 · 용도 · 컨테이너<input id="db-query" type="search" value="${esc(catalogQuery)}" placeholder="예: 정수 필터" autocomplete="off"></label><label>분류<select id="db-category"><option value="">전체 분류</option>${cats.map(c=>`<option ${catalogCategory===c?'selected':''}>${c}</option>`).join('')}</select></label></div><div id="db-results">${catalogResults()}</div></section><section class="panel" id="db-detail">${catalogDetail()}</section></div>`}
function facilityDetail(){return bunkerFacilityDetail()}
function bunkerPage(){return bunkerHubPage()}
function handleDB(d){if(d.db==='prev'||d.db==='next'){catalogOffset=Math.max(0,catalogOffset+(d.db==='next'?24:-24));$('#db-results').innerHTML=catalogResults();return}if(d.db==='item'&&GOODS[d.id]){procurementNote='';catalogSelected=d.id;$('#db-detail').innerHTML=catalogDetail();$('#db-results').innerHTML=catalogResults();if(innerWidth<=700)$('#db-detail').scrollIntoView({block:'start'});return}if(d.db==='lookup'&&GOODS[d.id]){procurementNote='';catalogSelected=d.id;catalogQuery=GOODS[d.id][0];catalogCategory='';catalogOffset=0;page='catalog';save();render();$('.content').scrollTop=0;return}if(d.db==='facility'&&FACILITIES[d.id]){facilitySelected=d.id;facilityTier=Number(d.tier)||1;page='bunker';save();renderKeep();if(innerWidth<=700)$('#facility-detail').scrollIntoView({block:'start'});return}if(d.db==='tier'){facilityTier=Number(d.tier);$('#facility-detail').innerHTML=facilityDetail()}}
inside.addEventListener('input',e=>{if(e.target.id==='db-query'){catalogQuery=e.target.value;catalogOffset=0;$('#db-results').innerHTML=catalogResults()}});

function head(code,title,desc){return `<div class="head"><span class="mono">${code}</span><h1>${title}</h1><p>${desc}</p></div>`}
function render(){rendering=true;reconcile();inside.classList.toggle('large',large);document.documentElement.classList.toggle('reduce-motion',reduce);$('.nav').innerHTML=pages.filter(p=>!['catalog','stash'].includes(p[0])).map(p=>`<button data-page="${p[0]}" ${p[0]===page?'aria-current="page"':''}><span class="ico">${p[1]}</span>${p[2]}</button>`).join('');let c='';if(page==='home')c=head('00 / COMMAND CENTER','메인 화면','B-04 벙커 · 현장 작전 단말기')+`<div class="hero"><div><span class="mono"><i class="led"></i>SYSTEM ONLINE</span><h2>작전 단말기 접속 완료</h2><p>필요한 정보를 선택하십시오.</p><button class="primary" data-page="map">작전 지도 열기 ›</button></div>${radar}</div><div class="modules">${modules.map(m=>`<button class="module" data-page="${m[0]}"><span class="mono">APP / ${m[1]}</span><b>${m[2]} ›</b><small>${m[3]}</small></button>`).join('')}</div>`;if(page==='bunker')c=bunkerPage();if(page==='catalog')c=catalogPage();if(page==='stash')c=stashPage();if(page==='map')c=sectorMapPage();if(page==='raid')c=raidPage();if(page==='inventory')c=inventoryPage();if(page==='journal')c=journalPage();if(page==='settings')c=head('04 / DEVICE SETTINGS','단말 설정','가독성과 조작 접근성')+`<div class="panel"><div class="setting"><div><b>글자 크기</b><small>표준 / 크게</small></div><button data-setting="large" aria-pressed="${large}">${large?'크게':'표준'}</button></div><div class="setting"><div><b>동작 줄이기</b><small>부팅과 카메라 진입 효과</small></div><button data-setting="reduce" aria-pressed="${reduce}">${reduce?'켜짐':'꺼짐'}</button></div><div class="setting"><div><b>야간 올리브</b><small>고정 디자인 토큰</small></div><span style="color:var(--accent)">● NIGHT OLIVE</span></div></div>`;if(page==='settings')c+=backupPanel();$('.content').innerHTML=c+(page==='map'?fieldControls():'');const current=contentView();if(current!==lastContentView){$('.content').scrollTop=0;lastContentView=current}updateRaidClock();rendering=false}

function layout(){const w=innerWidth,h=innerHeight;const s=Math.min(w/864,h/1536);return {s,x:(w-864*s)/2,y:(h-1536*s)/2}}function transform(g){return `translate(${g.x}px,${g.y}px) scale(${g.s})`}function place(){if(!busy)phone.style.transform=transform(layout())}function zoom(){const g=layout(),s=Math.max(innerWidth/640,innerHeight/1312,g.s*1.35);return {s,x:innerWidth/2-433*s,y:innerHeight/2-735*s}}function motion(el,frames,ms){return el.animate(frames,{duration:reduce?0:ms,easing:'cubic-bezier(.3,.65,.2,1)',fill:'forwards'})}async function travel(direction,to=page){if(busy||power!=='on')return;busy=true;world.setAttribute('aria-busy','true');const entering=direction==='in';hits.inert=true;if(entering){lastButton=document.activeElement;page=to;save();render();const a=motion(phone,[{transform:transform(layout())},{transform:transform(zoom())}],760);const f=motion(fade,[{opacity:0,offset:0},{opacity:0,offset:.45},{opacity:1,offset:1}],760);await a.finished;inside.hidden=false;world.hidden=true;a.cancel();f.cancel();view='inside';const v=motion(inside,[{opacity:0},{opacity:1}],180);await v.finished;v.cancel();$('.content').focus({preventScroll:true});}else{inside.hidden=true;world.hidden=false;const a=motion(phone,[{transform:transform(zoom())},{transform:transform(layout())}],660);const f=motion(fade,[{opacity:1},{opacity:0}],500);await a.finished;a.cancel();f.cancel();view='photo';phone.style.transform=transform(layout());(lastButton&&lastButton.isConnected?lastButton:$('#start')).focus({preventScroll:true});}busy=false;hits.inert=false;world.removeAttribute('aria-busy');place()}
function setPower(){document.documentElement.classList.toggle('reduce-motion',reduce);hits.hidden=power!=='on';layer.hidden=power==='on';if(power==='off'){layer.innerHTML='';$('#sidekey').setAttribute('aria-label','측면 전원 켜기')}else if(power==='boot'){layer.innerHTML='<div><p>RL-TC01 / SYSTEM BOOT</p><h1>RUSTLINE</h1><div class="boot-line"><i></i></div><p>단말기 초기화 중</p></div>'}else{$('#sidekey').setAttribute('aria-label','측면 전원 버튼');$('#start').focus({preventScroll:true})}$('#announce').textContent=power==='on'?'단말기 켜짐':power==='off'?'단말기 꺼짐':'단말기 부팅 중'}function powerToggle(){if(busy)return;clearTimeout(bootTimer);save();if(power==='on'||power==='boot'){power='off';setPower()}else{power='boot';setPower();bootTimer=setTimeout(()=>{power='on';setPower()},reduce?0:850)}}
world.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||busy)return;if(b.id==='sidekey'||b.hasAttribute('data-wake')||b.dataset.launch==='power')return powerToggle();const key=b.dataset.launch;if(key==='start')travel('in','home');else if(key==='bunker')travel('in','bunker');else if(key==='continue')travel('in',page);else if(key==='settings')travel('in','settings')});inside.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||busy)return;const d=b.dataset;if(d.gear)return handleEquipment(d);if(d.order)return changeOrder(d.order);if(d.hideout)return handleHideout(d);if(d.supply)return buyMaterial(d.supply);if(d.backup==='export')return exportSave();if(d.backup==='import')return $('#restore-file').click();if(d.db)return handleDB(d);if(d.raid)return handleRaidAction(d.raid);if(d.field)return handleField(d);if(d.pick){if(!isActive())return;if(picked?.uid===d.pick&&picked.side===d.side)return;picked={uid:d.pick,side:d.side,rot:false};notice='';renderKeep();return}if(d.cell==='bag'&&picked){transfer(Number(d.x),Number(d.y));return}if(d.action==='shutdown'){save();inside.hidden=true;world.hidden=false;view='photo';place();powerToggle();return}if(d.action==='return')return travel('out');if(d.action==='lock'){setLock(true);return}if(d.action==='unlock'){setLock(false);return}if(d.page&&pages.some(p=>p[0]===d.page)){page=d.page;picked=null;notice='';save();render();$('.content').focus();return}if(d.zone!==undefined&&!raid&&Number.isInteger(Number(d.zone))&&FIELD_ZONES[Number(d.zone)]){zone=Number(d.zone);save();render();$(`[data-zone="${zone}"]`).focus()}if(d.item!==undefined){item=Number(d.item);save();render();$(`[data-item="${item}"]`).focus()}if(d.setting){if(d.setting==='large')large=!large;else reduce=!reduce;save();render();$(`[data-setting="${d.setting}"]`).focus()}});inside.addEventListener('dblclick',e=>{const b=e.target.closest('[data-pick][data-side=loot]');if(b&&isActive()&&!field.contact){picked={uid:b.dataset.pick,side:'loot',rot:false};transfer()}});inside.addEventListener('dragstart',e=>{const b=e.target.closest('[data-pick]');if(!b||!isActive())return;dragged={uid:b.dataset.pick,side:b.dataset.side,rot:false};e.dataTransfer.setData('text/plain',b.dataset.pick);e.dataTransfer.effectAllowed='move'});inside.addEventListener('dragover',e=>{if(dragged&&e.target.closest('[data-grid=bag]')){e.preventDefault();e.dataTransfer.dropEffect='move'}});inside.addEventListener('drop',e=>{const g=e.target.closest('[data-grid=bag]');if(!g||!dragged)return;e.preventDefault();const r=g.getBoundingClientRect(),x=Math.floor((e.clientX-r.left-1)/(g.clientWidth/raidBagSize()[0])),y=Math.floor((e.clientY-r.top-1)/(g.clientHeight/raidBagSize()[1]));picked=dragged;dragged=null;transfer(x,y)});inside.addEventListener('dragend',()=>{dragged=null});function setLock(on){$('#lock').hidden=!on;for(const sel of ['.topbar','.body','.foot'])$(sel).inert=on;if(on)$('#lock button').focus();else $('.content').focus()}document.addEventListener('keydown',e=>{if(e.key==='Escape'&&view==='inside'&&!busy){if(!$('#lock').hidden){setLock(false)}else travel('out')}});setInterval(updateRaidClock,250);document.addEventListener('visibilitychange',updateRaidClock);window.addEventListener('focus',updateRaidClock);window.addEventListener('storage',e=>{if(e.key===SAVE11||(!writer&&e.key===SAVE10)||e.key===null){loadRaid();picked=null;updateRaidClock();if(view==='inside')renderKeep()}});startSession();updateRaidClock();window.addEventListener('resize',place);document.documentElement.classList.toggle('reduce-motion',reduce);place();})();</script></body></html>
