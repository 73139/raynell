<script>(()=>{'use strict';const $=s=>document.querySelector(s),world=$('#world'),phone=$('#phone'),inside=$('#inside'),layer=$('#power-layer'),hits=$('#main-hits'),fade=$('#fade');const pages=[['home','⌂','홈'],['bunker','▣','벙커'],['map','◇','지도'],['inventory','▦','장비'],['journal','≡','기록'],['settings','⚙','설정']];const modules=[['map','01','작전 지도','구역과 경로 확인'],['inventory','02','개인 장비','보급품 확인 및 선택'],['journal','03','현장 기록','수신 메시지 열람'],['settings','04','단말 설정','표시 및 조작 설정']];const zones=[['벙커 외곽','안전 구역 · 예시'],['폐쇄 검문소','미확인 구역 · 예시'],['보급 창고','수색 대상 · 예시']];const items=[['응급 파우치','의료 보급품'],['물통','생활 보급품'],['통신 모듈','전자 장비'],['기록 카드','정보 물품']];let power='on',page='home',view='photo',busy=false,zone=0,item=0,large=false,reduce=matchMedia('(prefers-reduced-motion: reduce)').matches,bootTimer=0,lastButton=null;
try{const saved=JSON.parse(localStorage.getItem('rl-reboot-tc01-v03')||'{}');if(pages.some(p=>p[0]===saved.page))page=saved.page;if(Number.isInteger(saved.zone)&&saved.zone>=0&&saved.zone<zones.length)zone=saved.zone;if(Number.isInteger(saved.item)&&saved.item>=0&&saved.item<items.length)item=saved.item;large=saved.large===true;if(typeof saved.reduce==='boolean')reduce=saved.reduce}catch{}function save(){try{localStorage.setItem('rl-reboot-tc01-v03',JSON.stringify({page,zone,item,large,reduce}))}catch{}}
const radar=`<svg viewBox="0 0 340 178" aria-hidden="true"><defs><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#82966a28"/></pattern><linearGradient id="fadeg" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#152017"/><stop offset="1" stop-color="#445335"/></linearGradient></defs><rect width="340" height="178" fill="url(#fadeg)"/><rect width="340" height="178" fill="url(#grid)"/>${[26,46,68].map(r=>`<circle cx="170" cy="89" r="${r}" stroke="#a8b37d88" fill="none"/>`).join('')}<path d="M0 170L170 89 340 170 M0 125L170 89 340 125 M170 0V178 M0 89H340" stroke="#a8b37d77" fill="none"/><path d="M24 139L82 105 140 130 170 89 237 112 296 48" stroke="#d7af66" stroke-dasharray="5 4" fill="none"/><g fill="#d7af66"><circle cx="82" cy="105" r="4"/><circle cx="170" cy="89" r="6"/><circle cx="296" cy="48" r="4"/></g><path d="M170 70V108M151 89H189" stroke="#ecebd8" stroke-width="1.5"/></svg>`;
const mapSvg=()=>`<svg class="map" viewBox="0 0 340 240" aria-label="가상 지역 지도" role="img"><rect width="340" height="240" fill="#1b271b"/>${Array.from({length:18},(_,i)=>`<path d="M${i*20} 0V240 M0 ${i*20}H340" stroke="#5d715044" stroke-width=".6"/>`).join('')}<path d="M20 25 136 14 168 71 119 123 43 116 12 77Z M180 24 313 39 324 110 261 144 177 100Z M35 146 123 125 198 155 222 222 56 231Z" fill="#313d2b" stroke="#687753"/><path d="M73 79L171 113 261 83 M171 113L129 187" stroke="#a0a782" stroke-dasharray="7 6" fill="none" stroke-width="2"/>${[[73,79],[261,83],[129,187]].map((p,i)=>`<g><circle cx="${p[0]}" cy="${p[1]}" r="${zone===i?12:7}" fill="#d7af66" opacity="${zone===i?1:.55}"/><text x="${p[0]+15}" y="${p[1]-8}" fill="#ecebd8" font-size="12">0${i+1}</text></g>`).join('')}</svg>`;

// Raid clock v0.4: wall-clock deadline, independent save key, no action-based time deduction.
const RAID_DURATION_MS=30*60*1000, RAID_KEY='rl-reboot-raid-v04';
let raid=null, raidStorageOK=true, lastRaidPhase='';
function raidPhase(now=Date.now()){return !raid?'idle':now>=raid.endsAt?'expired':'active'}
function raidRemaining(now=Date.now()){return raid?Math.max(0,Math.min(RAID_DURATION_MS,raid.endsAt-now)):0}
function formatRaid(ms){const seconds=Math.ceil(ms/1000);return String(Math.floor(seconds/60)).padStart(2,'0')+':'+String(seconds%60).padStart(2,'0')}
function loadRaid(){try{const raw=JSON.parse(localStorage.getItem(RAID_KEY)||'null');raid=raw&&Number.isSafeInteger(raw.startedAt)&&Number.isSafeInteger(raw.endsAt)&&raw.endsAt-raw.startedAt===RAID_DURATION_MS&&Number.isInteger(raw.zone)&&raw.zone>=0&&raw.zone<zones.length?raw:null;raidStorageOK=true}catch{raidStorageOK=false}}
function storeRaid(next){raid=next;try{localStorage.setItem(RAID_KEY,JSON.stringify(next));raidStorageOK=true}catch{raidStorageOK=false}}
function raidControls(){const phase=raidPhase();return `<section id="raid-controls" aria-label="출격 관리">${phase==='active'?'<p>레이드 진행 중 · 다른 화면에서도 시간이 흐릅니다.</p><button data-raid="stop">레이드 중단</button>':phase==='expired'?'<p class="expired-text">시간 초과 · 레이드 종료</p><p>현재는 타이머 검증 단계이며 아이템 손실·탈출 정산은 연결되지 않았습니다.</p><button data-raid="ack">결과 확인 · 출격 준비</button>':'<p>선택 지역: '+zones[zone][0]+' · 제한 시간 30분</p><button class="primary" data-raid="start">출격 시작</button>'}${raidStorageOK?'':'<p class="expired-text">브라우저 저장소 사용 불가 · 새로고침 후 복원이 보장되지 않습니다.</p>'}</section>`}
function updateRaidClock(){const phase=raidPhase(),bar=$('#raid-status');inside.classList.toggle('raid-visible',phase!=='idle');bar.hidden=phase==='idle';bar.classList.toggle('urgent',phase==='active'&&raidRemaining()<=300000);bar.classList.toggle('expired',phase==='expired');if(phase!=='idle'){$('#raid-clock').textContent=formatRaid(raidRemaining());$('#raid-label').textContent=phase==='expired'?'시간 초과 · 레이드 종료':'레이드 진행 중';$('#raid-zone').textContent=zones[raid.zone][0];}if(phase!==lastRaidPhase){const before=lastRaidPhase;lastRaidPhase=phase;if(phase==='expired'&&before==='active')$('#announce').textContent='레이드 제한 시간이 끝났습니다.';const controls=$('#raid-controls');if(controls)controls.outerHTML=raidControls();}}
function handleRaidAction(action){loadRaid();const phase=raidPhase();if(action==='start'&&phase==='idle'){const now=Date.now();storeRaid({startedAt:now,endsAt:now+RAID_DURATION_MS,zone});}else if(action==='ack'&&phase==='expired'){storeRaid(null)}else if(action==='stop'&&phase==='active'){if(!window.confirm('현재 레이드를 중단하시겠습니까?'))return;loadRaid();if(raidPhase()==='active')storeRaid(null)}render();updateRaidClock();$('.content').focus({preventScroll:true})}
loadRaid();

function head(code,title,desc){return `<div class="head"><span class="mono">${code}</span><h1>${title}</h1><p>${desc}</p></div>`}
function render(){inside.classList.toggle('large',large);document.documentElement.classList.toggle('reduce-motion',reduce);$('.nav').innerHTML=pages.map(p=>`<button data-page="${p[0]}" ${p[0]===page?'aria-current="page"':''}><span class="ico">${p[1]}</span>${p[2]}</button>`).join('');let c='';if(page==='home')c=head('00 / COMMAND CENTER','메인 화면','B-04 벙커 시스템 · 인터페이스 시제품')+`<div class="hero"><div><span class="mono"><i class="led"></i>SYSTEM ONLINE</span><h2>작전 단말기 접속 완료</h2><p>필요한 정보를 선택하십시오.</p><button class="primary" data-page="map">작전 지도 열기 ›</button></div>${radar}</div><div class="modules">${modules.map(m=>`<button class="module" data-page="${m[0]}"><span class="mono">APP / ${m[1]}</span><b>${m[2]} ›</b><small>${m[3]}</small></button>`).join('')}</div>`;if(page==='bunker')c=head('05 / BUNKER ACCESS','벙커 접속','거점 인터페이스 · 실제 게임 기능 연결 전')+`<div class="hero"><div><span class="mono">B-04 / LOCAL</span><h2>벙커 관리 단말기</h2><p>보관 장비와 기록을 확인하십시오.</p><button class="primary" data-page="inventory">개인 장비 확인 ›</button></div>${radar}</div><div class="modules"><button class="module" data-page="journal"><span class="mono">LOG / 03</span><b>벙커 기록 ›</b><small>수신 메시지 확인</small></button><button class="module" data-page="map"><span class="mono">MAP / 01</span><b>작전 지도 ›</b><small>가상 지역 확인</small></button></div>`;if(page==='map')c=head('01 / SECTOR MAP','작전 지도','구역 선택 방식 검토용 가상 지도')+`<div class="twocol"><div class="panel">${mapSvg()}</div><div class="panel"><h2>구역 목록</h2><div class="stack">${zones.map((z,i)=>`<button data-zone="${i}" aria-pressed="${zone===i}">0${i+1} · ${z[0]}</button>`).join('')}</div><p aria-live="polite">${zones[zone][1]}</p></div></div>`;if(page==='inventory')c=head('02 / EQUIPMENT','개인 장비','보급품 선택 및 상세 표시 시제품')+`<div class="twocol"><div class="panel"><h2>보급품 / 4개</h2><div class="grid-inv">${Array.from({length:12},(_,i)=>i<4?`<button class="cell" data-item="${i}" aria-pressed="${item===i}"><b>${['✚','◉','▣','≡'][i]}</b>${items[i][0]}</button>`:'<div class="cell empty">·</div>').join('')}</div></div><div class="panel" aria-live="polite"><span class="mono">ITEM / 0${item+1}</span><h2>${items[item][0]}</h2><p>${items[item][1]} · 예시 슬롯</p><p>실제 장착·수량·거래 기능은 아직 연결되지 않았습니다.</p></div></div>`;if(page==='journal')c=head('03 / FIELD JOURNAL','현장 기록','단말기 수신 메시지')+`<div class="panel"><div class="entry"><span class="mono">LOG / 001</span><h2>단말기 기동 확인</h2><p>B-04 단말기 연결이 정상입니다.</p></div><div class="entry"><span class="mono">LOG / 002</span><h2>통신 대기</h2><p>작전 데이터는 연결 전입니다.</p></div></div>`;if(page==='settings')c=head('04 / DEVICE SETTINGS','단말 설정','가독성과 조작 접근성')+`<div class="panel"><div class="setting"><div><b>글자 크기</b><small>표준 / 크게</small></div><button data-setting="large" aria-pressed="${large}">${large?'크게':'표준'}</button></div><div class="setting"><div><b>동작 줄이기</b><small>부팅과 카메라 진입 효과</small></div><button data-setting="reduce" aria-pressed="${reduce}">${reduce?'켜짐':'꺼짐'}</button></div><div class="setting"><div><b>야간 올리브</b><small>고정 디자인 토큰</small></div><span style="color:var(--accent)">● NIGHT OLIVE</span></div></div>`;$('.content').innerHTML=c+(page==='map'?raidControls():'');updateRaidClock()}

function layout(){const w=innerWidth,h=innerHeight;const s=Math.min(w/864,h/1536);return {s,x:(w-864*s)/2,y:(h-1536*s)/2}}function transform(g){return `translate(${g.x}px,${g.y}px) scale(${g.s})`}function place(){if(!busy)phone.style.transform=transform(layout())}function zoom(){const g=layout(),s=Math.max(innerWidth/640,innerHeight/1312,g.s*1.35);return {s,x:innerWidth/2-433*s,y:innerHeight/2-735*s}}function motion(el,frames,ms){return el.animate(frames,{duration:reduce?0:ms,easing:'cubic-bezier(.3,.65,.2,1)',fill:'forwards'})}async function travel(direction,to=page){if(busy||power!=='on')return;busy=true;world.setAttribute('aria-busy','true');const entering=direction==='in';hits.inert=true;if(entering){lastButton=document.activeElement;page=to;save();render();const a=motion(phone,[{transform:transform(layout())},{transform:transform(zoom())}],760);const f=motion(fade,[{opacity:0,offset:0},{opacity:0,offset:.45},{opacity:1,offset:1}],760);await a.finished;inside.hidden=false;world.hidden=true;a.cancel();f.cancel();view='inside';const v=motion(inside,[{opacity:0},{opacity:1}],180);await v.finished;v.cancel();$('.content').focus({preventScroll:true});}else{inside.hidden=true;world.hidden=false;const a=motion(phone,[{transform:transform(zoom())},{transform:transform(layout())}],660);const f=motion(fade,[{opacity:1},{opacity:0}],500);await a.finished;a.cancel();f.cancel();view='photo';phone.style.transform=transform(layout());(lastButton&&lastButton.isConnected?lastButton:$('#start')).focus({preventScroll:true});}busy=false;hits.inert=false;world.removeAttribute('aria-busy');place()}
function setPower(){document.documentElement.classList.toggle('reduce-motion',reduce);hits.hidden=power!=='on';layer.hidden=power==='on';if(power==='off'){layer.innerHTML='';$('#sidekey').setAttribute('aria-label','측면 전원 켜기')}else if(power==='boot'){layer.innerHTML='<div><p>RL-TC01 / SYSTEM BOOT</p><h1>RUSTLINE</h1><div class="boot-line"><i></i></div><p>단말기 초기화 중</p></div>'}else{$('#sidekey').setAttribute('aria-label','측면 전원 버튼');$('#start').focus({preventScroll:true})}$('#announce').textContent=power==='on'?'단말기 켜짐':power==='off'?'단말기 꺼짐':'단말기 부팅 중'}function powerToggle(){if(busy)return;clearTimeout(bootTimer);save();if(power==='on'||power==='boot'){power='off';setPower()}else{power='boot';setPower();bootTimer=setTimeout(()=>{power='on';setPower()},reduce?0:850)}}
world.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||busy)return;if(b.id==='sidekey'||b.hasAttribute('data-wake')||b.dataset.launch==='power')return powerToggle();const key=b.dataset.launch;if(key==='start')travel('in','home');else if(key==='bunker')travel('in','bunker');else if(key==='continue')travel('in',page);else if(key==='settings')travel('in','settings')});inside.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||busy)return;const d=b.dataset;if(d.raid)return handleRaidAction(d.raid);if(d.action==='shutdown'){save();inside.hidden=true;world.hidden=false;view='photo';place();powerToggle();return}if(d.action==='return')return travel('out');if(d.action==='lock'){setLock(true);return}if(d.action==='unlock'){setLock(false);return}if(d.page&&pages.some(p=>p[0]===d.page)){page=d.page;save();render();$('.content').focus();return}if(d.zone!==undefined){zone=Number(d.zone);save();render();$(`[data-zone="${zone}"]`).focus()}if(d.item!==undefined){item=Number(d.item);save();render();$(`[data-item="${item}"]`).focus()}if(d.setting){if(d.setting==='large')large=!large;else reduce=!reduce;save();render();$(`[data-setting="${d.setting}"]`).focus()}});function setLock(on){$('#lock').hidden=!on;for(const sel of ['.topbar','.body','.foot'])$(sel).inert=on;if(on)$('#lock button').focus();else $('.content').focus()}document.addEventListener('keydown',e=>{if(e.key==='Escape'&&view==='inside'&&!busy){if(!$('#lock').hidden){setLock(false)}else travel('out')}});setInterval(updateRaidClock,250);document.addEventListener('visibilitychange',updateRaidClock);window.addEventListener('focus',updateRaidClock);window.addEventListener('storage',e=>{if(e.key===RAID_KEY||e.key===null){loadRaid();updateRaidClock();if(page==='map'&&$('#raid-controls'))$('#raid-controls').outerHTML=raidControls()}});updateRaidClock();window.addEventListener('resize',place);document.documentElement.classList.toggle('reduce-motion',reduce);place();})();</script></body></html>
