name: R17 regression verification
on:
  push:
    branches: [tarkov-r17-development]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  safety-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - name: Install dependencies
        run: npm ci --include=dev --ignore-scripts --no-audit --no-fund
      - name: Build map and OCR assets for embedded native tests
        run: |
          node scripts/build-maps.mjs
          node scripts/build-ocr.mjs
      - name: Restore dev dependencies after OCR asset preparation
        run: npm ci --include=dev --ignore-scripts --no-audit --no-fund
      - name: Run all website regression tests
        run: npm test
      - name: Prepare native embedded frontend
        run: |
          mkdir -p native-source/dist
          cp -R website/. native-source/dist/
      - name: Run existing native regression tests
        run: cd native-source && go test ./...
      - name: Build Windows x64 preview
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: '0'
        run: cd native-source && go build -trimpath -ldflags '-s -w' -o ../TarkovFieldGuide_R17.exe .
      - name: Package preview ZIP and checksum
        run: |
          cat > R17_README.txt <<'TXT'
          Tarkov Field Guide R17 development preview - Windows x64.
          1. Extract the ZIP.
          2. Run TarkovFieldGuide_R17.exe.
          3. Open tactical tools > r17 operations center.
          4. Connect the EFT Logs and Screenshots folders for read-only tracking.
          Important: screenshot locations are the last screenshot, not continuous live tracking.
          Extraction availability, map-floor certainty, and danger data are not live guaranteed.
          This is an experimental preview. Keep using r16 for production.
          TXT
          printf 'Source commit: %s\nBranch: tarkov-r17-development\n' "$GITHUB_SHA" > BUILD_INFO.txt
          zip -9 TarkovFieldGuide_R17_Preview_Windows.zip TarkovFieldGuide_R17.exe R17_README.txt BUILD_INFO.txt
          sha256sum TarkovFieldGuide_R17_Preview_Windows.zip > R17_SHA256SUMS.txt
          unzip -t TarkovFieldGuide_R17_Preview_Windows.zip
      - name: Upload downloadable CI artifact
        uses: actions/upload-artifact@v4
        with:
          name: TarkovFieldGuide_R17_Preview_Windows
          path: |
            TarkovFieldGuide_R17_Preview_Windows.zip
            R17_SHA256SUMS.txt
      - name: Publish separate prerelease (never overwrite r16)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view tfg-r17-preview >/dev/null 2>&1 || gh release create tfg-r17-preview --target "$GITHUB_SHA" --title 'Tarkov Field Guide r17 preview' --prerelease --notes 'Experimental preview. Existing r16 release remains unchanged. See included readme for limitations.'
          gh release upload tfg-r17-preview TarkovFieldGuide_R17_Preview_Windows.zip R17_SHA256SUMS.txt --clobber
          gh release edit tfg-r17-preview --target "$GITHUB_SHA" --prerelease --notes "Experimental r17 preview; source commit $GITHUB_SHA. Map log automation, screenshot filename location, floor metadata, economy and raid utilities. Does not guarantee live extraction availability, continuous positions, or fully safe traversal. r16 release is unchanged."
