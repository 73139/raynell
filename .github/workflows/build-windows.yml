name: Build Windows companion
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: tfg-windows-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows-companion:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install pinned dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Restore verified map build
        id: map-cache
        uses: actions/cache/restore@v4
        with:
          path: website/maps/latest
          key: ${{ runner.os }}-tfg-maps-${{ hashFiles('scripts/maps-upstream.json', 'scripts/maps-assets-lock.json', 'scripts/map-assets-core.mjs', 'scripts/build-maps.mjs', 'website/floor-core.mjs') }}
      - name: Prepare current calibrated map assets
        run: node scripts/build-maps.mjs
      - name: Save verified map build
        if: steps.map-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: website/maps/latest
          key: ${{ steps.map-cache.outputs.cache-primary-key }}
      - name: Test complete web startup and data failure handling
        run: npm test
      - name: Prepare verified local OCR assets
        run: node scripts/build-ocr.mjs
      - name: Verify desktop and mobile map layout
        run: |
          npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund playwright@1.62.1
          npx playwright install --with-deps chromium
          node scripts/test-layout.cjs
      - name: Copy web UI for standalone binary
        run: |
          rm -rf native-source/dist
          mkdir -p native-source/dist
          cp -R website/. native-source/dist/
      - name: Test native HTTP server and bundled assets
        run: cd native-source && go test -v ./...
      - name: Build Windows x64 standalone
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: '0'
        run: cd native-source && go build -trimpath -ldflags '-s -w' -o ../TarkovFieldGuide.exe .
      - name: Package with Korean instructions
        run: |
          cat > START_HERE.txt <<'TXT'
          Tarkov Field Guide - Windows x64
          1. Extract the ZIP into a folder.
          2. Run TarkovFieldGuide.exe (no Node.js required).
          3. The app opens a local 127.0.0.1 page with Map, Quests, Flea Market and Bag Prices.
          3a. Game Logs folder is discovered for auto map switching. If not found, click Windows Logs folder selector.
          4. Use the mouse wheel to scroll. Use +/- or Ctrl+wheel to zoom the map.
          5. Enter a raid: the app reads EFT application_000.log to switch maps automatically.
          6. Open Bag Prices and upload a photo you took in the game.
          The app compares the pictures in inventory slots with its built-in item atlas.
          Select the bag region to limit totals. Review similar pictures and adjust stack amounts.
          Does not automatically take screenshots, press game keys, change game files, or read game memory.
          TXT
          printf 'Source commit: %s\nNative version: 2026.11.14-r16-auto-map\n' "$GITHUB_SHA" > BUILD_INFO.txt
          zip -9 TarkovFieldGuide_Windows.zip TarkovFieldGuide.exe START_HERE.txt BUILD_INFO.txt
          printf '%s\n' "$GITHUB_SHA" > website/maps/latest/BUILD_COMMIT.txt
          tar -czf TarkovFieldGuide_Maps.tar.gz -C website maps/latest MAP_SOURCES.txt
          sha256sum TarkovFieldGuide_Windows.zip TarkovFieldGuide_Maps.tar.gz > SHA256SUMS.txt
      - name: Verify reusable public map archive
        run: node scripts/test-built-maps.mjs TarkovFieldGuide_Maps.tar.gz
      - name: Publish Windows download
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view tfg-r16-windows >/dev/null 2>&1 || gh release create tfg-r16-windows --target "$GITHUB_SHA" --title 'Tarkov Field Guide Windows' --notes 'Standalone Windows x64 companion. No Node.js installer. Source on tarkov-r16-free branch.'
          gh release upload tfg-r16-windows TarkovFieldGuide_Windows.zip TarkovFieldGuide_Maps.tar.gz SHA256SUMS.txt --clobber
          gh release edit tfg-r16-windows --notes "Windows x64 field guide. Source commit: $GITHUB_SHA on tarkov-r16-free. Bag prices recognize inventory pictures with item review and totals. The map auto-switches on EFT application logs using read-only local file access. No automatic screenshots or input. Includes maps, quest photos, Kappa lines and flea prices. No automatic keypress or screenshot capture."
