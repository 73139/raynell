name: Build Windows companion
on:
  push:
    branches: [tarkov-r16-free]
    paths:
      - 'native-source/**'
      - 'website/**'
      - 'scripts/build-ocr.mjs'
      - 'scripts/test-startup.cjs'
      - 'scripts/test-layout.cjs'
      - 'scripts/test-guide-core.mjs'
      - 'scripts/test-market.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/build-windows.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows-companion:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install pinned dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Test complete web startup and data failure handling
        run: npm test
      - name: Prepare verified local OCR assets
        run: node scripts/build-ocr.mjs
      - name: Verify desktop and mobile map layout
        run: |
          npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund playwright@1.62.1
          npx playwright install --with-deps chromium
          node scripts/test-layout.cjs
      - name: Copy web UI for standalone binary
        run: |
          rm -rf native-source/dist
          mkdir -p native-source/dist
          cp -R website/. native-source/dist/
      - name: Test native HTTP server and bundled assets
        run: cd native-source && go test -v ./...
      - name: Build Windows x64 standalone
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: '0'
        run: cd native-source && go build -trimpath -ldflags '-s -w' -o ../TarkovFieldGuide.exe .
      - name: Package with Korean instructions
        run: |
          cat > START_HERE.txt <<'TXT'
          Tarkov Field Guide - Windows x64
          1. Extract the ZIP into a folder.
          2. Run TarkovFieldGuide.exe (no Node.js required).
          3. The app opens a local 127.0.0.1 page with Map, Quests, Flea Market and Bag Prices.
          4. Use the mouse wheel to scroll. Use +/- or Ctrl+wheel to zoom the map.
          5. Open Bag Prices and upload a photo you took in the game.
          Readable item names are matched to public flea/trader prices.
          If only icons are visible, search and add those items manually.
          Does not automatically press game keys or read game memory.
          TXT
          printf 'Source commit: %s\nNative version: 2026.11.13-r16-market-routes\n' "$GITHUB_SHA" > BUILD_INFO.txt
          zip -9 TarkovFieldGuide_Windows.zip TarkovFieldGuide.exe START_HERE.txt BUILD_INFO.txt
          sha256sum TarkovFieldGuide_Windows.zip > SHA256SUMS.txt
      - name: Publish Windows download
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view tfg-r16-windows >/dev/null 2>&1 || gh release create tfg-r16-windows --target "$GITHUB_SHA" --title 'Tarkov Field Guide Windows' --notes 'Standalone Windows x64 companion. No Node.js installer. Source on tarkov-r16-free branch.'
          gh release upload tfg-r16-windows TarkovFieldGuide_Windows.zip SHA256SUMS.txt --clobber
          gh release edit tfg-r16-windows --notes "Standalone Windows x64 companion. Source commit: $GITHUB_SHA on tarkov-r16-free. Maps, boss and player spawns, Kappa task lines, sourced loot routes, flea prices and bag photo valuation. Includes verified local OCR assets. No automatic keypress or screenshot capture."
